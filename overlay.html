<!DOCTYPE html>
<html lang="en" data-ov-name="overlay" data-ov-zoom="fit" data-ov-own-alpha>
<head>
<meta charset="UTF-8">
<title>Fuzzy's Droid Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="overlay-theme.css">
<style>
  :root{
    --r-base: #9aa39d;
    --r-gold: #e8c04a;
    --r-diamond: #4fd3e8;
    --r-rainbow1: #ff6ec7;
    --r-rainbow2: #6ecbff;
    --r-beskar: #b9c2cc;
    --r-galactic: #c96bf2;
    --r-stellar: #e08a3c;
    --r-kyber: #50c878; /* confirmed 2026-09-26 from in-game Kyber cards (emerald), see timers.html --kyber */
    --accent: #4fb8ff; /* v1.9.0: this overlay's own lightsaber color — blue, matches the tracker's chrome */
    --sw-rgb: 79,184,255;
    /* overlay-theme.css overrides for this HUD: its own opacity setting, the
       current level's greener backdrop, a smaller icon, and a green highlight */
    --ov-backdrop-alpha: 0.55;
    --ov-backdrop-current-rgb: 14,26,20;
    --ov-icon-size: 34px;
    --ov-highlight-rgb: 94,242,166;
  }
  html,body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;
    width:100%; height:100%;
  }
  .panel{
    position:relative;
    display:flex; flex-direction:column; gap:6px;
    width:100%; height:100%; box-sizing:border-box;
    padding:24px 6px 6px; /* extra top room for .border-badge, see below */
  }
  /* ---------------------------------------------------------------------
     Border badge (v1.10.0): the selected border skin's emblem, straddling
     the panel's top edge — replaces the old flat saber-color picker with a
     full illustrated border (glow + corner brackets, already drawn by
     sw-texture.css off --sw-rgb, plus this badge). Centered on y=24 (the
     padding-top above) so it sits half in the reserved top margin, half
     over the content below, matching every other overlay's badge. */
  .border-badge{
    position:absolute; top:9px; left:50%; transform:translateX(-50%);
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#0c1210; border:2px solid var(--accent); color:var(--accent);
    box-shadow:0 0 8px -2px var(--accent);
    z-index:3;
  }
  .drag-handle{
    display:none;
    cursor:move; touch-action:none; /* moved by overlay-drag.js, never -webkit-app-region */
    align-items:center; justify-content:space-between;
    background:rgba(94,242,166,0.22);
    border:1px solid rgba(94,242,166,0.55);
    border-radius:6px;
    padding:4px 8px;
    font-size:11px;
    color:#eafff3;
    letter-spacing:.02em;
  }
  body.unlocked .drag-handle{ display:flex; }
  .drag-handle button{
    background:var(--accent); color:#08130d; border:none; border-radius:4px;
    font-size:11px; font-weight:700; padding:3px 9px; cursor:pointer;
  }
  .blocks{ display:flex; flex-direction:column; gap:4px; flex:1; min-height:0; }
  @keyframes fdt-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){ .block{ animation:none!important; } }
  .block{
    animation:fdt-in .22s ease-out both;
    /* Padding/gap trimmed 2026-09-19 alongside the panel's own width/height
       cut in main.js — a real screenshot showed these blocks' background
       running well past their 2-3 chip content. */
    background:
      radial-gradient(140% 160% at 0% 0%, rgba(255,255,255,0.05), transparent 60%),
      rgba(var(--ov-backdrop-rgb), var(--ov-backdrop-alpha));
    border:1px solid rgba(255,255,255,0.10);
    border-left:3px solid rgba(255,255,255,0.25);
    border-radius:8px;
    padding:4px 8px;
    flex:1;
    min-height:0;
    display:flex; flex-direction:column; justify-content:center; gap:2px;
    box-shadow:0 2px 8px -3px rgba(0,0,0,0.5);
  }
  /* v1.18.1 the READY strip (hudState): the lines skipped as fully marked, with the next rebirth's
     credit cost. Slim and fixed-height; while it shows, 3 lines do instead of 4. Not a .block, so
     the selection keys and the level-tag clicks never land on it. */
  .ready-strip{
    flex:none; display:flex; align-items:center; justify-content:space-between; gap:6px; min-width:0;
    padding:3px 8px; border-radius:8px; animation:fdt-in .22s ease-out both;
    background:rgba(var(--ov-backdrop-rgb), var(--ov-backdrop-alpha));
    border:1px solid rgba(93,255,110,0.30); border-left:3px solid #5dff6e;
  }
  .ready-tag{
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:800; letter-spacing:.06em;
    color:#03170b; background:#5dff6e; border-radius:999px; padding:2px 8px; white-space:nowrap;
  }
  .block.current{
    border-left-color: var(--accent);
    background:
      radial-gradient(140% 160% at 0% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
      rgba(var(--ov-backdrop-current-rgb), var(--ov-backdrop-alpha));
    box-shadow: 0 0 0 1px rgba(94,242,166,0.35) inset, 0 0 10px -2px rgba(94,242,166,0.4);
  }
  .block .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; font-weight:800; letter-spacing:.06em;
    color:#0b0f0d; background:rgba(255,255,255,0.22);
    border-radius:999px; padding:2px 8px; display:inline-block; width:fit-content;
    text-shadow:none;
  }
  .block.current .tag{ background:var(--accent); color:#08130d; box-shadow:0 0 6px -1px var(--accent); }
  .tag{ pointer-events: auto; cursor: pointer; }
  /* v1.15.1: the level's rebirth credit cost, right of its tag: the game's credit
     coin + bold italic green with a black outline (like the in-game CREDITS card)
     on a dark chip, so it reads over any scene (the user's pick of 4 mockups) */
  .block-head{ display:flex; align-items:center; justify-content:space-between; gap:6px; min-width:0; }
  .credits{
    font-family:'Rajdhani',sans-serif; font-style:italic; font-weight:700;
    font-size:calc(16px * var(--ov-text-scale, 1)); letter-spacing:.01em; line-height:1.25;
    color:#5dff6e;
    text-shadow:-1px -1px 0 #031a06, 1px -1px 0 #031a06, -1px 1px 0 #031a06, 1px 1px 0 #031a06, 0 2px 3px rgba(0,0,0,0.9);
    display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
    background:rgba(4,12,6,0.72); border:1px solid rgba(93,255,110,0.55); border-radius:999px;
    padding:0 9px 0 3px; box-shadow:0 0 6px -2px rgba(93,255,110,0.6);
    /* the chip is ~5px taller than the tag; let it spill into the block's 4px top
       padding and the 2px gap below, so the header row (and the cards) keep their room */
    margin:-3px 0 -2px;
  }
  /* the game's credit coin (--credit-coin, set in the script below), drawn as a vector */
  .credits::before{
    content:''; flex:none; width:calc(17px * var(--ov-text-scale, 1)); height:calc(17px * var(--ov-text-scale, 1));
    background:var(--credit-coin) center/contain no-repeat;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,0.8));
  }
  .block.current .credits{ color:#86ff92; border-color:rgba(134,255,146,0.8); }
  /* v1.16.0 (a player's request): the Nova Crystals this rebirth gives, left of its
     credit cost, on the same kind of chip in violet. REBIRTH_CRYSTALS in droid-data.js. */
  /* a touch more compact than .credits, so both chips stay clear of the border badge
     on the top block even at "+300 · 2.5QA" (measured in dev/hud-credits-preview.html) */
  .head-chips{ display:inline-flex; align-items:center; gap:3px; min-width:0; }
  .head-chips .credits{ padding:0 7px 0 2px; } /* 2 px tighter than on its own (v1.16.0), for the same reason */
  .crystals{
    font-family:'Rajdhani',sans-serif; font-style:italic; font-weight:700;
    font-size:calc(15px * var(--ov-text-scale, 1)); letter-spacing:0; line-height:1.25;
    color:#dcc4ff;
    text-shadow:-1px -1px 0 #1a0633, 1px -1px 0 #1a0633, -1px 1px 0 #1a0633, 1px 1px 0 #1a0633, 0 2px 3px rgba(0,0,0,0.9);
    display:inline-flex; align-items:center; gap:1px; white-space:nowrap;
    background:rgba(14,6,26,0.72); border:1px solid rgba(181,123,255,0.55); border-radius:999px;
    padding:0 5px 0 2px; box-shadow:0 0 6px -2px rgba(181,123,255,0.6);
    margin:-3px 0 -2px;
  }
  .crystals::before{
    content:''; flex:none; width:calc(15px * var(--ov-text-scale, 1)); height:calc(15px * var(--ov-text-scale, 1));
    background:var(--nova-crystal) center/contain no-repeat;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,0.8));
  }
  .block.current .crystals{ color:#ecdcff; border-color:rgba(200,160,255,0.85); }
  /* ---------------------------------------------------------------------
     Card style redesigned 2026-09-20 to match the Safe to Retire overlay's
     look (declutter.html) — a droid portrait in a rarity-colored frame
     instead of a plain color dot — per request, including real droid
     images this HUD never showed before. Each level always has exactly 3
     slots, so (unlike declutter's list, whose length varies) this is a
     fixed 3-across row rather than a wrapping/reflowing grid, and the same
     icon-size cap declutter.html uses is applied here too so a card can
     never blow up regardless of window size. */
  .d-row{ display:flex; gap:5px; }
  .d-cell{
    flex:1; min-width:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px; overflow:hidden;
    pointer-events: auto; cursor: pointer;
  }
  .d-icon-wrap{
    position:relative; width:100%; max-width:var(--ov-icon-size); max-height:var(--ov-icon-size); aspect-ratio:1/1;
    border-radius:6px;
    background:rgba(var(--ov-box-rgb), var(--ov-box-alpha));
    border:2px solid var(--rc, var(--r-base));
    box-shadow:0 0 5px -1px var(--rc, transparent);
    display:flex; align-items:center; justify-content:center;
    overflow:visible; /* v1.16.0: the SELL flag hangs off the right side; the picture rounds its own corners */
  }
  .d-icon-wrap img{
    width:100%; height:100%; object-fit:cover; border-radius:4px;
  }
  /* v1.16.0 SELL flags: a flag hanging off the picture's right side, in the empty
     space beside it, so the droid stays fully visible (the user's pick of the
     dev/sell-banner-mockup.html rounds). Colours = the old Cycle 5 chart: yellow
     SELL = never needed again this cycle; red / Kyber green = the rebirth that
     needs it again (21-30 / 31+). requirements.js sellFlagFor() decides. */
  .sell-flag{
    position:absolute; z-index:2; left:calc(100% + 1px); bottom:1px; pointer-events:none; white-space:nowrap;
    font:700 calc(12.5px * var(--ov-text-scale, 1))/1 'Rajdhani',sans-serif; padding:2px 4px 1px 3px;
    border-radius:0 5px 5px 0; border:1px solid rgba(0,0,0,0.9); border-left:0; box-shadow:1px 1px 3px rgba(0,0,0,0.8);
  }
  .sell-flag.yellow{ font-size:calc(8.5px * var(--ov-text-scale, 1)); letter-spacing:.04em; padding:3px 4px 2px 3px; background:#f5c518; color:#140f00; }
  .sell-flag.red{ background:#d91f1f; color:#fff; text-shadow:0 0 2px #000, 0 1px 1px #000; }
  .sell-flag.kyber{ background:var(--r-kyber); color:#03170b; }
  /* v1.16.0 👥 friend view (hudFriend hotkey): an amber name tag and amber level edges, so it's never mistaken for your own list */
  .friend-tag{
    display:none; position:absolute; top:4px; left:8px; z-index:4;
    font:700 12px 'Rajdhani',sans-serif; letter-spacing:.06em; color:#1a1204;
    background:#f2b95e; border-radius:999px; padding:1px 9px; box-shadow:0 0 8px -1px rgba(242,185,94,0.8);
  }
  .friend-tag small{ font:600 9.5px 'IBM Plex Mono',monospace; letter-spacing:0; opacity:.8; margin-left:4px; }
  html.friend-view .friend-tag{ display:block; }
  html.friend-view .block{ border-left-color:rgba(242,185,94,0.55); }
  html.friend-view .block.current{ border-left-color:#f2b95e; }
  .d-name{
    font-size:calc(9.5px * var(--ov-text-scale, 1)); font-weight:700; color:#f2f6f4; text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,0.9); line-height:1.15;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .d-owned{
    font-family:'IBM Plex Mono',monospace;
    font-size:calc(7.5px * var(--ov-text-scale, 1)); font-weight:600; text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,0.9); opacity:0.85;
  }
  /* v1.17.0 Rarity on each droid ('Written under the name', overlay-theme.css): the extra
     "NEED …" line makes each block ~4px too tall for the fixed HUD window, so the picture is
     6px smaller and the block padding 1px tighter (measured: nothing is cut off). */
  html.rarity-text:not(.ov-compact){ --ov-icon-size:28px; }
  html.rarity-text:not(.ov-compact) .block{ padding-top:3px; padding-bottom:3px; gap:1px; }
  .d-cell.owned{ opacity:0.42; }
  .d-cell.owned .d-name{ text-decoration:line-through; }
  /* v1.10.3: hotkey-based marking — selected droid highlight */
  .d-cell.selected {
    box-shadow: 0 0 12px 0 rgba(var(--ov-highlight-rgb), 1), inset 0 0 8px -2px rgba(var(--ov-highlight-rgb), 0.3);
    border-radius: 8px;
  }
  .d-cell.selected .d-icon-wrap {
    box-shadow: 0 0 12px -1px var(--accent);
    transform: scale(1.05);
    transition: transform 0.1s ease;
  }
</style>
<link rel="stylesheet" href="sw-texture.css">
</head>
<body>
  <div class="panel">
    <div class="border-badge" id="borderBadge"></div>
    <div class="drag-handle" id="dragHandle">
      <span>Drag to move, corner to resize, then Lock</span>
      <button id="lockBtn">Lock</button>
    </div>
    <div class="friend-tag" id="friendTag"></div>
    <div class="blocks" id="blocks"></div>
  </div>

<script src="card-icons-data.js"></script>
<script src="droid-data.js"></script>
<script src="requirements.js"></script>
<script>
(function(){
  if(!window.overlayAPI){
    document.body.innerHTML = '<div style="color:#fff;padding:10px;font:12px sans-serif;">Open this file through the Fuzzy\'s Droid Tracker app, not directly in a browser.</div>';
    return;
  }

  // v1.15.1: the game's credit coin (a gold hexagon with the credit sign), one SVG
  // shared by every block's .credits::before through a CSS variable.
  const CREDIT_COIN_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
    '<defs><linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2a93a"/><stop offset="1" stop-color="#6b4306"/></linearGradient>' +
    '<linearGradient id="f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset=".45" stop-color="#f5bf3a"/><stop offset="1" stop-color="#c6860f"/></linearGradient></defs>' +
    '<polygon points="31,16 23.5,29 8.5,29 1,16 8.5,3 23.5,3" fill="url(#r)"/>' +
    '<polygon points="28,16 22,26.4 10,26.4 4,16 10,5.6 22,5.6" fill="url(#f)"/>' +
    '<path d="M11.4 9.6V21.8M8 13.4H13.4M8 17H13.4M11.4 9.6H22L16 23" fill="none" stroke="#fff1b3" stroke-width="2.6" stroke-linejoin="round" transform="translate(.7 .7)" opacity=".7"/>' +
    '<path d="M11.4 9.6V21.8M8 13.4H13.4M8 17H13.4M11.4 9.6H22L16 23" fill="none" stroke="#7a4a06" stroke-width="2.6" stroke-linejoin="round"/>' +
    '</svg>';
  document.documentElement.style.setProperty('--credit-coin', 'url("data:image/svg+xml,' + encodeURIComponent(CREDIT_COIN_SVG) + '")');
  applyNovaCrystalIcon(); // v1.16.0 (requirements.js)

  const DOT_COLOR = { B:'var(--r-base)', G:'var(--r-gold)', D:'var(--r-diamond)', R:'var(--r-rainbow2)', K:'var(--r-beskar)', X:'var(--r-galactic)', S:'var(--r-stellar)', Y:'var(--r-kyber)' };

  let currentCycle = 1;
  let currentLevel = 0; // last rebirth COMPLETED; 0 = none yet
  let ownedRankLocal = {};
  let selectedPos = { levelIndex: 0, slot: 0 }; // v1.10.3: hotkey-based marking — track which level card + droid (0-2)
  // v1.16.0 👥: the friends pasted in the tracker ('rebirth-friends' codes, the readable
  // ones decoded) and whose list the HUD shows: 0 = you, n = friends[n-1]. A friend's
  // list is look-only: clicks and the mark keys do nothing while it's showing.
  let friends = [];
  let hudView = 0;
  function viewingFriend(){ return hudView > 0 ? (friends[hudView - 1] || null) : null; }
  function setFriends(codes){
    friends = (Array.isArray(codes) ? codes : []).map(decodeFriendCode).filter(f => !f.error);
    if(hudView > friends.length) hudView = 0;
  }

  async function loadIndexData(){
    nameMerges = (await window.overlayAPI.storeGet('rebirth-nameMerges')) || {};
    displayOverrides = (await window.overlayAPI.storeGet('rebirth-displayOverrides')) || {};
    buildIndex();
  }

  async function loadProgress(){
    currentCycle = (await window.overlayAPI.storeGet('rebirth-activeCycle')) || 1;
    currentLevel = (await window.overlayAPI.storeGet('rebirth-currentLevel')) || 0;
    ownedRankLocal = (await window.overlayAPI.storeGet('rebirth-ownedRank-v2')) || {};
    setFriends(await window.overlayAPI.storeGet('rebirth-friends'));
  }

  // v1.16.0: the SELL flag markup for sellFlagFor(this card), or ''
  function sellFlagHtml(f){
    if(!f) return '';
    if(f.kind === 'yellow') return '<span class="sell-flag yellow">SELL</span>';
    return '<span class="sell-flag ' + f.kind + '">' + f.next + '</span>';
  }

  function cellHtml(d, friend){
    const reqColor = DOT_COLOR[d.code] || 'var(--r-base)';
    const ownedCode = (d.ownedRankValue !== undefined) ? RARITY_ORDER[d.ownedRankValue] : null;
    const ownedColor = ownedCode ? (DOT_COLOR[ownedCode] || 'var(--r-base)') : 'rgba(255,255,255,0.5)';
    const haveText = ownedCode ? ((friend ? 'Has: ' : 'Have: ') + RNAME[ownedCode]) : 'Not owned';
    const iconKey = d.cycle + '-' + d.level + '-' + d.slot;
    const b64 = (typeof CARD_ICONS !== 'undefined' && CARD_ICONS[iconKey]) || (typeof ICONS !== 'undefined' && ICONS[iconKey]);
    const src = b64 ? 'data:image/webp;base64,' + b64 : '';
    const imgTag = src ? ('<img src="' + src + '" alt="' + d.display + '" loading="lazy">') : '';
    const flag = sellFlagFor(d.cycle, d.level, d.slot);
    const sellText = !flag ? '' : flag.kind === 'yellow' ? ' — SELL: not needed again this cycle' : (' — can be sold, needed again at Rebirth ' + flag.next);
    const title = d.display + ' — need ' + RNAME[d.code] + ' — ' + (ownedCode ? ((friend ? 'they have ' : 'you have ') + RNAME[ownedCode]) : 'not logged yet') + sellText;
    return '<div class="d-cell' + (d.owned ? ' owned' : '') + '" data-cycle="' + d.cycle + '" data-level="' + d.level + '" data-slot="' + d.slot + '" title="' + title + '">' +
      '<div class="d-icon-wrap" style="--rc:' + reqColor + ';">' + imgTag + sellFlagHtml(flag) + '</div>' +
      '<div class="d-name">' + d.display + '</div>' +
      '<div class="rar-label ' + d.code + '">Need ' + RNAME[d.code] + '</div>' + // shown by 'Written under the name' (v1.17.0)
      '<div class="d-owned" style="color:' + ownedColor + '">' + haveText + '</div>' +
    '</div>';
  }

  // v1.18.1 "🎯 Next Droids Needed": the 4 lines shown, starting at the first one still
  // needed (requirements.js nextNeededLevel: from the rebirth level on, fully marked lines
  // skipped, never past an unfinished one). getUpcomingLevels wraps to the next cycle's
  // levels 1+ once the current cycle runs out, so this is never empty at the end of a
  // cycle; it previews the next cycle's first rebirths instead, same idea as Sneak Preview.
  // A friend's list (v1.16.0) follows the same rule with their marks.
  // The lines it skipped (between the rebirth level and the top line) are fully marked: ready to
  // rebirth. They become one slim "✓ READY" strip with the next rebirth's credit cost, and then
  // only 3 lines show, so the fixed-size window never gets taller content than before.
  function hudState(){
    const fr = viewingFriend();
    const cycle = fr ? fr.cycle : currentCycle;
    const level = fr ? fr.level : currentLevel;
    const owned = fr ? friendOwnedRank(fr.owned) : ownedRankLocal;
    const top = nextNeededLevel(cycle, level, owned);
    const firstReady = Math.max(0, level) + 1;
    const ready = top > firstReady ? { cycle, from: firstReady, to: top - 1 } : null;
    return { ready, lines: getUpcomingLevels(cycle, top - 1, owned, ready ? 3 : 4) };
  }
  function upcomingLines(){ return hudState().lines; }

  function readyStripHtml(r){
    if(!r) return '';
    const range = r.from === r.to ? String(r.from) : (r.from + '–' + r.to);
    const credits = rebirthCreditsFor(r.cycle, r.from);
    const creditsHtml = credits === null ? '' : '<span class="credits" title="Credits needed to go through with Rebirth ' + r.from + '">' + formatCredits(credits) + '</span>';
    return '<div class="ready-strip" title="Every droid for Rebirth ' + range + ' is marked: ready when you have the credits">' +
      '<span class="ready-tag">✓ READY · RB ' + range + '</span><span class="head-chips">' + creditsHtml + '</span></div>';
  }
  let shownTop = ''; // the top line as "cycle-level": when the list moves on, the selection goes back to its first droid

  function render(){
    const blocksEl = document.getElementById('blocks');
    const fr = viewingFriend(); // v1.16.0: a friend's list, or yours
    const cycle = fr ? fr.cycle : currentCycle;
    const st = hudState();
    const upcoming = st.lines;
    const top = upcoming[0] ? upcoming[0].cycle + '-' + upcoming[0].level : '';
    if(top !== shownTop){ if(shownTop) selectedPos = { levelIndex: 0, slot: 0 }; shownTop = top; }
    document.documentElement.classList.toggle('friend-view', !!fr);
    document.getElementById('friendTag').innerHTML = fr
      ? ('👥 ' + fr.name.toUpperCase() + '<small>C' + fr.cycle + ' · RB ' + fr.level + ' · ' + friendAgeText(fr.time) + '</small>') : '';

    blocksEl.innerHTML = readyStripHtml(st.ready) + upcoming.map((u, i)=>{
      const isCurrent = i === 0;
      const cycleTag = u.cycle !== cycle ? (' · Cycle ' + u.cycle) : '';
      const tag = (isCurrent ? 'NOW · Lvl ' : 'Lvl ') + u.level + cycleTag;
      const credits = rebirthCreditsFor(u.cycle, u.level); // v1.15.1
      const creditsHtml = credits === null ? '' : '<span class="credits" title="Credits needed to go through with Rebirth ' + u.level + '">' + formatCredits(credits) + '</span>';
      const crystals = rebirthCrystalsFor(u.cycle, u.level); // v1.16.0
      const crystalsHtml = crystals === null ? '' : '<span class="crystals" title="Nova Crystals for reaching Rebirth ' + u.level + '">+' + crystals + '</span>';
      return '<div class="block' + (isCurrent ? ' current' : '') + '" data-cycle="' + u.cycle + '" data-level="' + u.level + '">' +
        '<div class="block-head"><span class="tag">' + tag + '</span><span class="head-chips">' + crystalsHtml + creditsHtml + '</span></div>' +
        '<div class="d-row">' + u.droids.map(d => cellHtml(d, !!fr)).join('') + '</div>' +
      '</div>';
    }).join('');

    attachCellHandlers();
    applySelection(); // v1.10.3: highlight the selected droid
  }

  function attachCellHandlers(){
    // Attach click handlers to droid cells
    document.querySelectorAll('.d-cell').forEach(cell=>{
      cell.removeEventListener('click', handleDroidCellClick);
      cell.addEventListener('click', handleDroidCellClick);
    });
    // Attach click handlers to level tags
    document.querySelectorAll('.tag').forEach(tag=>{
      tag.removeEventListener('click', handleLevelTagClick);
      tag.addEventListener('click', handleLevelTagClick);
    });
  }

  async function handleDroidCellClick(e){
    if(viewingFriend()) return; // a friend's list is look-only
    const cell = e.currentTarget;
    const cycle = parseInt(cell.dataset.cycle, 10);
    const level = parseInt(cell.dataset.level, 10);
    const slot = parseInt(cell.dataset.slot, 10);
    await window.overlayAPI.markDroidFromOverlay({ cycle, level, slot });
  }

  async function handleLevelTagClick(e){
    e.stopPropagation();
    if(viewingFriend()) return;
    const block = e.currentTarget.closest('.block');
    if(!block) return;
    const cycle = parseInt(block.dataset.cycle, 10);
    const level = parseInt(block.dataset.level, 10);
    await window.overlayAPI.markLevelFromOverlay({ cycle, level });
    // v1.18.1: the store change re-renders, and a finished top line moves the list on (upcomingLines)
  }

  async function fullReload(){
    await loadIndexData();
    await loadProgress();
    render();
  }

  window.overlayAPI.onStoreChanged(({ key, value })=>{
    if(key === 'rebirth-ownedRank-v2'){ ownedRankLocal = value || {}; render(); }
    else if(key === 'rebirth-activeCycle'){ currentCycle = value || 1; selectedPos = { levelIndex: 0, slot: 0 }; render(); }
    else if(key === 'rebirth-currentLevel'){ currentLevel = value || 0; selectedPos = { levelIndex: 0, slot: 0 }; render(); }
    else if(key === 'rebirth-nameMerges' || key === 'rebirth-displayOverrides'){ fullReload(); }
    else if(key === 'rebirth-friends'){ setFriends(value); render(); } // v1.16.0
  });

  function applySettings(settings){
    document.documentElement.style.setProperty('--ov-backdrop-alpha', settings.opacity != null ? settings.opacity : 0.55);
    document.body.classList.toggle('unlocked', !settings.locked);
    // v1.10.0: this overlay's own border skin, picked in ⚙ Overlay Settings →
    // Borders. BORDER_SKINS/borderIconSvg come from requirements.js, loaded above.
    const skin = BORDER_SKINS[settings.border] || BORDER_SKINS.jedi;
    document.documentElement.style.setProperty('--accent', skin.hex);
    document.documentElement.style.setProperty('--sw-rgb', skin.rgb);
    const badge = document.getElementById('borderBadge');
    if(badge) badge.innerHTML = borderIconSvg(settings.border || 'jedi', 18);
  }
  window.overlayAPI.onSettingsChanged(applySettings);

  document.getElementById('lockBtn').addEventListener('click', ()=>{
    window.overlayAPI.setOverlayLocked(true);
  });

  // v1.10.3: hotkey-based marking in this overlay (the HUD, 🎯 Next Droids Needed since v1.18.1)
  window.overlayAPI.onHotkeyTriggered(async (name)=>{
    // v1.16.0 👥: you -> each friend -> you. Marking is off while a friend shows.
    if(name === 'hudFriend'){
      hudView = friends.length ? (hudView + 1) % (friends.length + 1) : 0;
      selectedPos = { levelIndex: 0, slot: 0 };
      render();
      return;
    }
    if(viewingFriend()) return;
    if(name === 'markLeft') moveSelection(-1, 0);
    else if(name === 'markRight') moveSelection(1, 0);
    else if(name === 'markUp') moveSelection(0, -1);
    else if(name === 'markDown') moveSelection(0, 1);
    else if(name === 'markDroid') await markSelected();
    else if(name === 'markLevel') await markCurrentLevel();
  });

  function moveSelection(slotDelta, levelDelta){
    const upcoming = upcomingLines();
    // Clamp to boundaries (no wrapping) — Math.max/min prevent going out of bounds
    selectedPos.slot = Math.max(0, Math.min(2, selectedPos.slot + slotDelta));
    selectedPos.levelIndex = Math.max(0, Math.min(upcoming.length - 1, selectedPos.levelIndex + levelDelta));
    applySelection();
  }

  function applySelection(){
    // Remove old selection highlight
    document.querySelectorAll('.d-cell.selected').forEach(c => c.classList.remove('selected'));
    if(viewingFriend()) return; // v1.16.0: no selection on a friend's (look-only) list
    // Find and highlight the selected cell
    const blocks = document.querySelectorAll('.block');
    if(selectedPos.levelIndex < blocks.length){
      const block = blocks[selectedPos.levelIndex];
      const cells = block.querySelectorAll('.d-cell');
      if(selectedPos.slot < cells.length){
        cells[selectedPos.slot].classList.add('selected');
      }
    }
  }

  async function markSelected(){
    const upcoming = upcomingLines();
    if(selectedPos.levelIndex >= upcoming.length) return;
    const level = upcoming[selectedPos.levelIndex];
    const droid = level.droids[selectedPos.slot];
    if(!droid) return;
    await window.overlayAPI.markDroidFromOverlay({
      cycle: droid.cycle,
      level: droid.level,
      slot: droid.slot,
    });
  }

  async function markCurrentLevel(){
    const upcoming = upcomingLines();
    if(selectedPos.levelIndex >= upcoming.length) return;
    const level = upcoming[selectedPos.levelIndex];
    // Mark all 3 droids in this level; the store changes re-render, and a finished
    // top line moves the list on (v1.18.1, upcomingLines)
    for(const droid of level.droids){
      await window.overlayAPI.markDroidFromOverlay({
        cycle: droid.cycle,
        level: droid.level,
        slot: droid.slot,
      });
    }
  }

  (async function init(){
    const settings = await window.overlayAPI.getSettings();
    applySettings(settings);
    await fullReload();
  })();
})();
</script>
<script src="overlay-theme.js"></script>
<script src="overlay-drag.js"></script>
</body>
</html>
