<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fuzzy's Droid Tracker — Hotkeys</title>
<style>
  html,body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;
    width:100%; height:100%;
  }
  .card{
    box-sizing:border-box;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    gap:10px;
    background:rgba(10,14,12,0.84);
    border:1px solid rgba(255,255,255,0.16);
    border-top:3px solid #5ef2a6;
    border-radius:14px;
    padding:16px 18px;
    box-shadow:0 8px 28px rgba(0,0,0,0.55);
  }
  .card h1{
    margin:0 0 2px 0; font-size:14px; font-weight:800; letter-spacing:.04em;
    color:#eafff3; text-transform:uppercase;
    text-shadow:0 1px 2px rgba(0,0,0,0.9);
  }
  .rows{ display:flex; flex-direction:column; gap:7px; flex:1; min-height:0; }
  .row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:8px;
    padding:7px 10px;
  }
  .row .label{
    font-size:12.5px; color:#f2f6f4;
    text-shadow:0 1px 2px rgba(0,0,0,0.8);
  }
  .row .keys{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:700;
    color:#5ef2a6; background:rgba(94,242,166,0.14);
    border:1px solid rgba(94,242,166,0.4);
    border-radius:6px; padding:3px 8px; white-space:nowrap;
    flex-shrink:0;
  }
  .hint{
    font-size:10.5px; color:#b9c4bd; text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,0.8);
  }
  .ver{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:#7c8983;
    text-align:center; letter-spacing:.03em;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>⌨ Fuzzy's Droid Tracker Hotkeys</h1>
    <div class="rows" id="rows"></div>
    <div class="hint" id="toggleHint">Press its hotkey to hide/show this list</div>
    <div class="ver" id="verTag" hidden></div>
  </div>

<script>
(function(){
  if(!window.overlayAPI){
    document.body.innerHTML = '<div style="color:#fff;padding:10px;font:12px sans-serif;">Open this file through the Fuzzy\'s Droid Tracker app, not directly in a browser.</div>';
    return;
  }

  /* Purely a reference card — reads the live hotkey bindings out of shared
     settings (same store every other hotkey button reads/writes) and
     re-renders whenever they change, so rebinding a hotkey in the tracker's
     settings panel updates this list immediately without needing a restart.
     Nothing here reads the screen or touches Fortnite. */
  // Ctrl+Shift+1-6 order, each overlay's optional scroll/tier hotkeys grouped
  // under it, timers last. Only BOUND hotkeys are listed — most are unbound
  // by default (see the "convention" comment above DEFAULT_SETTINGS in
  // main.js), and a "(none set)" row is no use on a quick-reference card.
  // main.js's computeDefaultHotkeyListBounds() sizes this window by the
  // same bound-only count, so the two must keep filtering the same way.
  const ROWS = [
    { key: 'hideAllHotkey', label: '🚫 Hide ALL overlays (one-way — won\'t turn them back on)' },
    { key: 'hotkeyListHotkey', label: 'Show / hide this hotkey list' },
    { key: 'hotkey', label: '🎯 Show / hide Current Rebirth Requirements' },
    { key: 'declutterHotkey', label: '♻ Show / hide Safe to Retire' },
    { key: 'declutterScrollUpHotkey', label: '♻ Scroll Safe to Retire Up' },
    { key: 'declutterScrollDownHotkey', label: '♻ Scroll Safe to Retire Down' },
    { key: 'declutterTierAllHotkey', label: '♻ Toggle All Tiers' },
    { key: 'declutterTierDefaultHotkey', label: '♻ Toggle Default' },
    { key: 'declutterTierRareHotkey', label: '♻ Toggle Rare' },
    { key: 'declutterTierEpicHotkey', label: '♻ Toggle Epic' },
    { key: 'declutterTierLegendaryHotkey', label: '♻ Toggle Legendary' },
    { key: 'declutterTierMythicHotkey', label: '♻ Toggle Mythic' },
    { key: 'rebirthReqOverlayHotkey', label: '🧬 Show / hide Rebirth Requirements' },
    { key: 'rebirthReqScrollUpHotkey', label: '🧬 Scroll Rebirth Requirements Up' },
    { key: 'rebirthReqScrollDownHotkey', label: '🧬 Scroll Rebirth Requirements Down' },
    { key: 'rebirthScreenHotkey', label: '📸 Read Rebirth Screen' },
    { key: 'timersHotkey', label: '⏱ Show / hide timer banners' }
  ];

  const rowsEl = document.getElementById('rows');
  const toggleHintEl = document.getElementById('toggleHint');

  function render(settings){
    rowsEl.innerHTML = '';
    ROWS.filter(r => settings[r.key]).forEach(r=>{
      const row = document.createElement('div');
      row.className = 'row';

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = r.label;

      const keys = document.createElement('span');
      keys.className = 'keys';
      keys.textContent = settings[r.key];

      row.appendChild(label);
      row.appendChild(keys);
      rowsEl.appendChild(row);
    });
    toggleHintEl.textContent = settings.hotkeyListHotkey
      ? 'Press ' + settings.hotkeyListHotkey + ' to hide/show this list'
      : 'Use the ⌨ Hotkeys button in the tracker to hide/show this list';
  }

  window.overlayAPI.onSettingsChanged(render);

  (async function init(){
    const settings = await window.overlayAPI.getSettings();
    render(settings);
  })();

  if(window.overlayAPI.getAppVersion){
    window.overlayAPI.getAppVersion().then((v)=>{
      if(!v) return;
      const verEl = document.getElementById('verTag');
      verEl.textContent = 'v' + v;
      verEl.hidden = false;
    }).catch(()=>{ /* not fatal — the list still works without it */ });
  }
})();
</script>
</body>
</html>
