<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fuzzy's Droid Tracker — Timers</title>
<style>
  :root{
    /* Color palette for blueprint timers (v1.10.5). Stellar and Mythic were
       re-matched 2026-09-19 against real in-game screenshots. Kyber color
       is a placeholder ([TBD] — will be updated when game update is live). */
    --stellar: #edb142;
    --rarity-mythic: #ff4d6d;
    --kyber: #50c878;  /* Confirmed 2026-09-26 from in-game Kyber cards (emerald) */
    --mission: #5ef2a6;
  }
  html,body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  /* v1.11.1: compact. The panel is only as big as its banners, and the window
     is fitted to it (fitWindow() -> main.js 'timers:fit'), so no empty box ever
     sits over the game. timersScale is a transform, so the layout size (what
     the ResizeObserver watches) stays put and fitWindow() multiplies it in. */
  .panel{
    position:relative;
    display:inline-flex; flex-direction:column; gap:4px;
    box-sizing:border-box;
    padding:5px;
    transform-origin:0 0;
  }
  /* v1.13.0: a border skin (settings.timersBorder) tints the outlines and puts its
     emblem on top; each banner's own top colour (which timer it is) stays. */
  body.skinned .panel{ padding-top:14px; }
  .t-badge{
    display:none; position:absolute; top:1px; left:50%; transform:translateX(-50%); z-index:2;
    width:20px; height:20px; border-radius:50%; box-sizing:border-box;
    align-items:center; justify-content:center;
    background:#0c1210; border:1.5px solid rgb(var(--t-skin-rgb)); color:rgb(var(--t-skin-rgb));
    box-shadow:0 0 6px -1px rgb(var(--t-skin-rgb));
  }
  body.skinned .t-badge{ display:flex; }
  body.skinned .banner{
    border-left-color:rgba(var(--t-skin-rgb),0.6); border-right-color:rgba(var(--t-skin-rgb),0.6); border-bottom-color:rgba(var(--t-skin-rgb),0.6);
    box-shadow:0 0 10px -4px rgb(var(--t-skin-rgb)), 0 2px 10px -2px rgba(0,0,0,0.5);
  }
  body.skinned .banner.mission{ border-left-color:var(--accent-color); border-top-color:rgba(var(--t-skin-rgb),0.6); }
  body.skinned .banner.imminent{
    box-shadow:0 0 0 1px var(--accent-color), 0 0 14px 1px var(--accent-color), inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .drag-handle{
    display:none;
    cursor:move; touch-action:none; /* moved by overlay-drag.js, never -webkit-app-region */
    align-items:center; justify-content:space-between;
    background:rgba(94,242,166,0.22);
    border:1px solid rgba(94,242,166,0.55);
    border-radius:6px;
    padding:4px 8px;
    font-size:11px;
    color:#eafff3;
    letter-spacing:.02em;
  }
  body.unlocked .drag-handle{ display:flex; }
  .drag-handle button{
    background:#5ef2a6; color:#08130d; border:none; border-radius:4px;
    font-size:11px; font-weight:700; padding:3px 9px; cursor:pointer;
  }
  /* Equal-width banners: 1fr columns in a shrink-to-fit grid all take the
     widest banner's width. Layout from settings.timersLayout (body[data-layout]). */
  .banners{ display:grid; gap:4px; grid-template-columns:repeat(4, 1fr); }
  body[data-layout="grid"] .banners{ grid-template-columns:repeat(2, 1fr); }
  body[data-layout="column"] .banners{ grid-template-columns:1fr; }
  .banner{
    display:flex; flex-direction:row; align-items:center; justify-content:flex-start;
    gap:6px;
    background:
      radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--accent-color, #9aa39d) 22%, transparent), transparent 60%),
      rgba(var(--t-backdrop-rgb, 10,14,12), var(--t-backdrop-alpha, 0.68)); /* the Appearance backdrop, v1.13.0 */
    border:1px solid color-mix(in srgb, var(--accent-color, #9aa39d) 45%, rgba(255,255,255,0.14));
    border-top:2px solid var(--accent-color, #9aa39d);
    border-radius:8px;
    padding:3px 10px 3px 5px;
    box-sizing:border-box;
    box-shadow:0 2px 10px -2px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.03);
    transition:box-shadow 0.3s ease;
  }
  .banner.mission{
    border-radius:999px;
    border-top:1px solid color-mix(in srgb, var(--accent-color, #9aa39d) 45%, rgba(255,255,255,0.14));
    border-left:4px solid var(--accent-color, #9aa39d);
  }
  /* Imminent state — added by render() once a banner's countdown drops under
     10s, so a glance catches "something's about to happen" without having
     to read the actual numbers. Pure CSS pulse, no JS animation loop. */
  .banner.imminent{
    box-shadow:0 0 0 1px var(--accent-color), 0 0 14px 1px var(--accent-color), inset 0 0 0 1px rgba(255,255,255,0.05);
    animation:pulse-glow 1s ease-in-out infinite;
  }
  @keyframes pulse-glow{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.35); }
  }
  .b-icon{
    flex:0 0 auto;
    width:20px; height:20px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--accent-color) 85%, white 15%), var(--accent-color) 70%);
    box-shadow:0 0 6px -1px var(--accent-color), inset 0 -2px 3px rgba(0,0,0,0.25);
    color:#0b0f0d;
  }
  .b-icon svg{ width:12px; height:12px; }
  .b-icon img{ width:14px; height:14px; object-fit:contain; }
  .b-body{
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
    gap:0; min-width:0; line-height:1.1;
  }
  .banner .b-label{
    font-size:8.5px; font-weight:700; letter-spacing:.06em;
    color:#f2f6f4; text-transform:uppercase;
    text-shadow:0 1px 2px rgba(0,0,0,0.9);
    white-space:nowrap;
  }
  .banner .b-time{
    font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;
    color:#ffffff;
    text-shadow:0 1px 3px rgba(0,0,0,0.95), 0 0 6px rgba(0,0,0,0.5);
  }
  .banner.stellar{ --accent-color: var(--stellar); }
  .banner.mythic{ --accent-color: var(--rarity-mythic); }
  .banner.kyber{ --accent-color: var(--kyber); }
  .banner.mission{ --accent-color: var(--mission); }
</style>
</head>
<body data-layout="row">
  <div class="panel">
    <div class="t-badge" id="timersBadge"></div>
    <div class="drag-handle" id="dragHandle">
      <span>Drag, then Lock</span>
      <button id="lockBtn">Lock</button>
    </div>
    <div class="banners" id="banners">
      <div class="banner stellar" id="stellarBanner">
        <div class="b-icon" title="Stellar Blueprint">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5 L14.7 9.3 L22.5 12 L14.7 14.7 L12 22.5 L9.3 14.7 L1.5 12 L9.3 9.3 Z"/></svg>
        </div>
        <div class="b-body">
          <span class="b-label">Stellar Blueprint</span>
          <span class="b-time" id="stellarTime">--:--</span>
        </div>
      </div>
      <div class="banner mythic" id="mythicBanner">
        <div class="b-icon" title="Mythic Blueprint">
          <svg viewBox="0 0 24 24"><path d="M12 2 L19.5 9 L12 22 L4.5 9 Z" fill="currentColor"/><path d="M4.5 9 L19.5 9 L12 2 Z" fill="rgba(255,255,255,0.4)"/></svg>
        </div>
        <div class="b-body">
          <span class="b-label">Mythic Blueprint</span>
          <span class="b-time" id="mythicTime">--:--</span>
        </div>
      </div>
      <div class="banner kyber" id="kyberBanner">
        <div class="b-icon" title="Kyber Blueprint">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L20 10 L16 22 L8 22 L4 10 Z"/></svg>
        </div>
        <div class="b-body">
          <span class="b-label">Kyber Blueprint</span>
          <span class="b-time" id="kyberTime">--:--</span>
        </div>
      </div>
      <div class="banner mission" id="missionBanner">
        <div class="b-icon" title="Next Mission">
          <img id="missionIcon" src="mission-icons/stormtrooper.png" alt="">
        </div>
        <div class="b-body">
          <span class="b-label" id="missionLabel">Next: —</span>
          <span class="b-time" id="missionTime">--:--</span>
        </div>
      </div>
    </div>
  </div>

<script src="droid-data.js"></script>
<script src="requirements.js"></script>
<script src="overlay-backgrounds.js"></script>
<script src="sounds/good-news-data.js"></script>
<script src="alert-sound.js"></script>
<script>
(function(){
  if(!window.overlayAPI){
    document.body.innerHTML = '<div style="color:#fff;padding:10px;font:12px sans-serif;">Open this file through the Fuzzy\'s Droid Tracker app, not directly in a browser.</div>';
    return;
  }

  /* Sound notifications: every sound (tones, Good news, the player's own files)
     is played by alert-sound.js's playAlert(), shared with the tracker's ▶ previews. */

  /* ---------------- timer math ----------------
     All four timers are pure wall-clock arithmetic against the system clock —
     nothing here reads the screen or touches Fortnite in any way. Each
     "next___" function returns the next Date a banner's event fires; render()
     re-runs this every second and just formats the remaining time. */

  function nextStellar(now){
    // Every 30 minutes: 5 min and 35 min after the hour (00:05, 00:35, 01:05, 01:35, ...).
    const candidates = [];
    for(let h = 0; h <= 1; h++){
      const a = new Date(now); a.setHours(a.getHours() + h, 5, 0, 0); candidates.push(a);
      const b = new Date(now); b.setHours(b.getHours() + h, 35, 0, 0); candidates.push(b);
    }
    candidates.sort((a, b) => a - b);
    return candidates.find(d => d > now);
  }

  function nextMythic(now){
    // Every hour, at :55 (1:55, 2:55, 3:55, ...).
    const next = new Date(now);
    next.setMinutes(55, 0, 0);
    if(next <= now) next.setHours(next.getHours() + 1);
    return next;
  }

  function nextKyber(now){
    // Every hour, at :15 (1:15, 2:15, 3:15, ...). v1.13.1: the 2026-09-26
    // launch event (every 5 minutes) is over, so its window was removed.
    const next = new Date(now);
    next.setMinutes(15, 0, 0);
    if(next <= now) next.setHours(next.getHours() + 1);
    return next;
  }

  // Missions were originally described as 45 minutes apart (10:50, 11:35,
  // 12:20, 1:05, ...), but each one then stays LIVE/active for a fixed
  // 5-minute window before the next one can start — so the real time from
  // one mission's start to the next is 45 + 5 = 50 minutes, not 45. (An
  // earlier version of this code only added those 5 minutes once, as a
  // one-time shift to the very first mark — that undercounted every single
  // cycle afterward by exactly 5 minutes, which is why the mismatch kept
  // reappearing each time a mission passed. The buffer has to be part of
  // the RECURRING period, not a one-off epoch nudge.)
  //
  // The mission name advances in lockstep around a repeating 4-item cycle.
  // Everything below is computed from one FIXED reference instant
  // (MISSION_NAME_EPOCH_MS) using pure elapsed-time arithmetic, never
  // "today's own 10:55am" recomputed fresh each call — because 50 minutes
  // does not evenly divide a 24-hour day (1440 / 50 = 28.8, not a whole
  // number, unlike the old 45-minute period's tidy 1440/45 = 32), so
  // resetting the reference to "today" would silently misalign the name
  // cycle across midnight. Elapsed-time-from-one-fixed-instant sidesteps
  // that failure mode entirely: it's correct for any period, on any day,
  // forever, since the grid extends infinitely in both directions from
  // that one instant regardless of which calendar day it happens to fall
  // on relative to "now."
  //
  // The exact clock time is still a best guess, though — small real-world
  // drift is possible. Rather than keep hand-tuning that guess, "Sync
  // mission timer" in the tracker app lets the player type in exactly what
  // the game's own countdown shows right now; that's stored as an exact
  // instant (missionSyncEpochMs) and used ONLY to sharpen the countdown
  // TARGET in nextMission() below. The NAME cycle is deliberately kept
  // anchored to the fixed MISSION_NAME_EPOCH_MS in
  // missionNameForOccurrence() no matter what — the player could sync
  // while any of the 4 missions is showing, not necessarily the first one,
  // so letting a sync shift the name-to-slot mapping would risk relabeling
  // every future mission. Both epochs sit on the same real 50-minute grid
  // (sync only ever corrects sub-minute drift, never a whole slot), so
  // Math.round() below always lands on the one correct name regardless of
  // which epoch produced the occurrence being named.
  const MISSION_CYCLE = ['Stormtrooper', 'Fishing', 'D-0', 'Mining'];

  // Real in-game icon crops, keyed off the same names used in MISSION_CYCLE.
  // Each source image had a flat, uniform (35,31,29) background tile behind
  // a white icon silhouette — chroma-keyed out to transparent, then
  // recolored to the same dark (#0b0f0d) used by the other three banners'
  // currentColor icons, so all four badges read consistently (a dark icon
  // on top of their own bright accent-colored circle).
  const MISSION_ICONS = {
    'Stormtrooper': 'mission-icons/stormtrooper.png',
    'Fishing': 'mission-icons/fishing.png',
    'D-0': 'mission-icons/d0.png',
    'Mining': 'mission-icons/mining.png',
  };
  const MISSION_COUNTDOWN_MS = 30 * 60 * 1000; // adjusted for 35-min period; fine-tune if needed
  const MISSION_RUN_DURATION_MS = 5 * 60 * 1000; // each mission stays live/active for 5 minutes before the next countdown starts
  const MISSION_PERIOD_MS = 35 * 60 * 1000; // 35 minutes, start-to-start (updated 2026-09-25)

  // A confirmed Stormtrooper (cycle index 0) instant, fixing only the NAME
  // cycle's phase — any correct reference instant works equally well since
  // the grid repeats forever in both directions.
  //
  // Re-derived 2026-09-19 from a real, precisely-timestamped in-game
  // reading: at 14:00:00 local the "NEXT MISSION" HUD showed Mining with
  // 40:20 remaining (go-live 14:40:20 local), with D-0 confirmed as the
  // mission that had just run before it — matching this cycle's own
  // D-0 -> Mining order, so only the phase (not the order) was ever wrong.
  // Mining is index 3, so Stormtrooper (index 0) falls exactly 3 periods
  // (150 min) earlier: 2026-09-19 12:10:20 local. The previous anchor
  // (2026-01-01 10:55:00, from an earlier, less precise report) is
  // superseded by this one rather than patched further.
  const MISSION_NAME_EPOCH_MS = new Date(2026, 8, 19, 12, 10, 20, 0).getTime();

  let missionSyncEpochMs = null; // set via "Sync mission timer"; an exact confirmed live-mission instant, used ONLY for the countdown target
  let lastMissionIconName = null; // only touch the <img> when the upcoming mission actually changes

  function missionStepIndex(occurrenceMs, epochMs){
    const steps = Math.round((occurrenceMs - epochMs) / MISSION_PERIOD_MS);
    return ((steps % MISSION_CYCLE.length) + MISSION_CYCLE.length) % MISSION_CYCLE.length;
  }

  function nextMission(now){
    const epochMs = (missionSyncEpochMs != null) ? missionSyncEpochMs : MISSION_NAME_EPOCH_MS;
    const nowMs = now.getTime();
    const k = Math.floor((nowMs - epochMs) / MISSION_PERIOD_MS) + 1;
    let nextMs = epochMs + k * MISSION_PERIOD_MS;
    if(nextMs <= nowMs) nextMs += MISSION_PERIOD_MS;
    return new Date(nextMs);
  }

  function missionNameForOccurrence(occurrence){
    const idx = missionStepIndex(occurrence.getTime(), MISSION_NAME_EPOCH_MS); // always the fixed nominal epoch, never the synced one
    return MISSION_CYCLE[idx];
  }

  function fmtRemaining(ms){
    if(ms < 0) ms = 0;
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const pad = (n) => String(n).padStart(2, '0');
    return h > 0 ? (h + ':' + pad(m) + ':' + pad(s)) : (pad(m) + ':' + pad(s));
  }

  // A banner pulses via .imminent once its own countdown drops under this
  // threshold — matches the ".banner.imminent" comment/animation in <style>.
  const IMMINENT_THRESHOLD_MS = 10 * 1000;

  function setImminent(bannerEl, remainingMs){
    bannerEl.classList.toggle('imminent', remainingMs >= 0 && remainingMs < IMMINENT_THRESHOLD_MS);
  }

  function playTimerSound(timerType, settings) {
    if (!settings.timerSoundEnabled) return;

    // v1.13.0: Stellar/Mythic/Kyber each have their own pick; none set = the
    // Blueprints pick (the only choice they had before).
    const choice = timerType === 'mission' ? settings.missionSoundChoice
      : (settings[timerType + 'SoundChoice'] || settings.blueprintSoundChoice);
    if (!choice || choice === 'off') return;

    // Determine volume: use override if enabled, otherwise use master
    let volume = settings.timerSoundVolume || 0.35;
    const overrideKey = timerType === 'mission' ? 'missionSoundVolumeOverride' : 'blueprintSoundVolumeOverride';
    const volumeKey = timerType === 'mission' ? 'missionSoundVolume' : 'blueprintSoundVolume';
    if (settings[overrideKey]) {
      volume = settings[volumeKey] || 0.35;
    }

    playAlert(choice, volume, (id) => window.overlayAPI.readCustomSound(id)).catch(() => {
      if (choice !== 'goodnews') playAlert('goodnews', volume).catch(() => {}); // a broken own file still alerts
    });
  }

  // v1.14.2: a mission warning is its own opt-in (a time picked in Timers → ⚠ Mission
  // warning), so it plays with its own sound and volume even when "Enable sound
  // notifications when timers expire" is off, like the Spawn Alert's sound. In v1.14.1
  // it went through playTimerSound() and that switch silently muted it.
  function playMissionWarning(settings){
    const choice = settings.missionWarnSound || 'chime';
    const v = Number(settings.missionWarnVolume);
    const volume = Number.isFinite(v) && v > 0 ? v : 0.35;
    playAlert(choice, volume, (id) => window.overlayAPI.readCustomSound(id)).catch(() => {
      if (choice !== 'chime') playAlert('chime', volume).catch(() => {}); // a broken own file still warns
    });
  }

  // Each next___() function above always returns the NEXT future occurrence,
  // so "remaining" (nextX(now) - now) can never actually reach <= 0 — the
  // instant a timer would hit zero, the next render() tick has already
  // recomputed nextX() to the following period, jumping remaining back up to
  // (nearly) the full period length. So "expiry" has to be detected as a
  // WRAP — the previous tick's remaining was small (about to fire) and this
  // tick's remaining is suddenly much larger than that — rather than ever
  // seeing remaining cross zero directly. lastRemainingMs starts at null so
  // the very first render() (nothing to compare against yet) never fires a
  // spurious sound on load.
  const lastRemainingMs = { stellar: null, mythic: null, kyber: null, mission: null };
  const WRAP_DETECT_WINDOW_MS = 1500; // a little over the 1s render() interval

  function checkExpiry(timerType, remainingMs, settings){
    const prev = lastRemainingMs[timerType];
    if(prev != null && prev >= 0 && prev < WRAP_DETECT_WINDOW_MS && remainingMs > prev){
      playTimerSound(timerType, settings);
    }
    lastRemainingMs[timerType] = remainingMs;
  }

  let currentSettings = {};

  function render(){
    const now = new Date();

    const stellarRemaining = nextStellar(now) - now;
    const mythicRemaining = nextMythic(now) - now;
    const kyberRemaining = nextKyber(now) - now;

    document.getElementById('stellarTime').textContent = fmtRemaining(stellarRemaining);
    document.getElementById('mythicTime').textContent = fmtRemaining(mythicRemaining);
    document.getElementById('kyberTime').textContent = fmtRemaining(kyberRemaining);

    setImminent(document.getElementById('stellarBanner'), stellarRemaining);
    setImminent(document.getElementById('mythicBanner'), mythicRemaining);
    setImminent(document.getElementById('kyberBanner'), kyberRemaining);

    // Play sound when timers expire (detected as a wrap, see checkExpiry above)
    checkExpiry('stellar', stellarRemaining, currentSettings);
    checkExpiry('mythic', mythicRemaining, currentSettings);
    checkExpiry('kyber', kyberRemaining, currentSettings);

    const missionAt = nextMission(now);
    const missionName = missionNameForOccurrence(missionAt);
    const missionRemaining = missionAt - now;
    document.getElementById('missionLabel').textContent = 'Next: ' + missionName;
    document.getElementById('missionTime').textContent = fmtRemaining(missionRemaining);
    setImminent(document.getElementById('missionBanner'), missionRemaining);

    // v1.14.1: "N seconds before the mission" warnings (missionWarningsDue() in
    // requirements.js), read against the previous tick before checkExpiry() updates it.
    // Several due on one tick (a slow tick) play once.
    if(missionWarningsDue(lastRemainingMs.mission, missionRemaining, currentSettings.missionWarnTimes).length){
      playMissionWarning(currentSettings);
    }
    // Play sound when mission timer expires
    checkExpiry('mission', missionRemaining, currentSettings);

    if(missionName !== lastMissionIconName){
      const iconEl = document.getElementById('missionIcon');
      iconEl.src = MISSION_ICONS[missionName] || iconEl.src;
      iconEl.alt = missionName;
      lastMissionIconName = missionName;
    }
  }

  const panel = document.querySelector('.panel');
  let scale = 1;
  // The window is exactly the (scaled) panel. Sent on every panel size change
  // (layout, unlock bar, a longer mission name) and scale change; main.js
  // ignores a size it already has.
  function fitWindow(){
    const r = panel.getBoundingClientRect();
    window.overlayAPI.fitTimers({ width: r.width, height: r.height });
  }
  new ResizeObserver(fitWindow).observe(panel);

  function applySettings(settings){
    currentSettings = settings; // Keep settings available for render()
    missionSyncEpochMs = (settings.missionSyncEpochMs != null) ? settings.missionSyncEpochMs : null;
    // Refit right away on a shape change: a hidden window's ResizeObserver
    // doesn't run until it's shown again.
    let refit = false;
    const unlocked = !settings.timersLocked;
    if(document.body.classList.contains('unlocked') !== unlocked){ document.body.classList.toggle('unlocked', unlocked); refit = true; }
    const layout = ['row', 'grid', 'column'].includes(settings.timersLayout) ? settings.timersLayout : 'row';
    if(document.body.dataset.layout !== layout){ document.body.dataset.layout = layout; refit = true; }
    const s = Math.min(1.5, Math.max(0.8, Number(settings.timersScale) || 1));
    if(s !== scale){
      scale = s;
      panel.style.transform = s === 1 ? '' : 'scale(' + s + ')';
      refit = true;
    }
    // v1.13.0: the Appearance backdrop (all-overlays values + the timers' own) and
    // an optional border skin (timersBorder; none = the classic look).
    const t = effectiveTheme(settings, 'timers');
    setVar('--t-backdrop-rgb', rgbOf(t.themeBackdrop));
    setVar('--t-backdrop-alpha', typeof t.themeBackdropAlpha === 'number' ? t.themeBackdropAlpha : null);
    const skinKey = settings.timersBorder;
    const skin = skinKey && BORDER_SKINS[skinKey];
    if(document.body.classList.contains('skinned') !== !!skin){ document.body.classList.toggle('skinned', !!skin); refit = true; }
    if(skin && skinKey !== shownSkin){
      setVar('--t-skin-rgb', skin.rgb);
      document.getElementById('timersBadge').innerHTML = borderIconSvg(skinKey, 12);
    }
    shownSkin = skin ? skinKey : null;
    // v1.20.0: panel background behind the banners (overlay-backgrounds.js)
    const bgKey = JSON.stringify([t.themeBg, t.themeBgStrength, t.themeBgColor, t.themeBgMotion, t.themeBgSpeed, skinKey, settings.overlayBgLight]);
    if(bgKey !== shownBg){
      shownBg = bgKey;
      applyOverlayBackground(t, skin ? skinKey : null, { light: settings.overlayBgLight === true });
    }
    if(refit) fitWindow();
  }
  let shownSkin = null, shownBg = null;
  function rgbOf(hex){
    const m = /^#([0-9a-f]{6})$/i.exec(hex || '');
    if(!m) return null;
    const n = parseInt(m[1], 16);
    return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
  }
  function setVar(name, value){
    if(value == null) document.documentElement.style.removeProperty(name);
    else document.documentElement.style.setProperty(name, String(value));
  }
  window.overlayAPI.onSettingsChanged(applySettings);

  document.getElementById('lockBtn').addEventListener('click', ()=>{
    window.overlayAPI.setTimersLocked(true);
  });

  (async function init(){
    const settings = await window.overlayAPI.getSettings();
    applySettings(settings);
    render();
    fitWindow();
    setInterval(render, 1000);
  })();
})();
</script>
<script src="overlay-drag.js"></script>
</body>
</html>
