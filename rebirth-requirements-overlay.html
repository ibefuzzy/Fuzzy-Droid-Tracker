<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fuzzy's Droid Tracker — Rebirth Requirements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --r-base: #9aa39d;
    --r-gold: #e8c04a;
    --r-diamond: #4fd3e8;
    --r-rainbow1: #ff6ec7;
    --r-rainbow2: #6ecbff;
    --r-beskar: #b9c2cc;
    --r-galactic: #c96bf2;
    --r-stellar: #e08a3c;
    --rarity-default: #9aa39d;
    --rarity-rare: #4fa3e8;
    --rarity-epic: #b06cf2;
    --rarity-legendary: #f4a93b;
    --rarity-mythic: #ff4d6d;
    --accent: #b06cf2; /* v1.9.0: this overlay's own lightsaber color — purple */
    --sw-rgb: 176,108,242;
  }
  html,body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;
    width:100%; height:100%;
  }
  .panel{
    display:flex; flex-direction:column; gap:6px;
    width:100%; height:100%; box-sizing:border-box;
    padding:6px;
  }
  .drag-handle{
    display:none;
    -webkit-app-region: drag;
    align-items:center; justify-content:space-between;
    background:rgba(94,242,166,0.22);
    border:1px solid rgba(94,242,166,0.55);
    border-radius:6px;
    padding:4px 8px;
    font-size:11px;
    color:#eafff3;
    letter-spacing:.02em;
  }
  body.unlocked .drag-handle{ display:flex; }
  .drag-handle button{
    -webkit-app-region: no-drag;
    background:var(--accent); color:#08130d; border:none; border-radius:4px;
    font-size:11px; font-weight:700; padding:3px 9px; cursor:pointer;
  }
  .card{
    flex:1; min-height:0; display:flex; flex-direction:column; gap:6px;
    background:rgba(10,14,12,0.62);
    border:1px solid rgba(255,255,255,0.14);
    border-top:3px solid var(--accent);
    border-radius:10px;
    padding:8px 9px;
    box-sizing:border-box;
    overflow:hidden;
  }
  .card h1{
    margin:0; font-size:11px; font-weight:800; letter-spacing:.05em;
    color:#eafff3; text-transform:uppercase;
    text-shadow:0 1px 2px rgba(0,0,0,0.9);
    display:flex; align-items:center; justify-content:space-between;
    gap:6px;
  }
  .card h1 .tags{ display:flex; align-items:center; gap:5px; flex:0 0 auto; }
  .card h1 .cycle-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px; font-weight:700; color:#dfe8e2;
    background:rgba(255,255,255,0.12); border-radius:999px;
    padding:1px 7px; letter-spacing:0; text-transform:none;
  }
  .card h1 .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; font-weight:700; color:#08130d;
    background:var(--accent); border-radius:999px;
    padding:1px 7px; letter-spacing:0;
  }
  /* ---------------------------------------------------------------------
     Redesigned 2026-09-23 alongside declutter.html — see the matching
     comment there. Fixed-size icons, auto-filled columns, natural row
     height, and a hotkey-scrolled viewport (declutterScrollUp/Down, shared
     with Safe to Retire since v1.7.3 — see the scroller wiring below —
     unbound by default) replace the old divide-the-height-into-N-rows grid
     and its pickCols() column tiers, which either crushed the icon (a fresh
     cycle's full 43-49 roster) or blew it up (a short list). Sorted lowest-
     to-highest required rarity so the parts you'll clear first stay
     together, matching the tracker's own Rebirth Requirements panel. */
  .list-wrap{ position:relative; flex:1; min-height:0; display:flex; }
  .list-viewport{
    position:relative; /* offsetParent for overlay-scroll.js's row math */
    flex:1; min-height:0; overflow:hidden;
    padding-right:8px; box-sizing:border-box;
  }
  .list-inner{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(80px, 1fr));
    gap:5px 4px;
    align-content:start;
  }
  .scrollbar{
    position:absolute; top:0; right:0; bottom:0; width:4px;
    background:rgba(255,255,255,0.08); border-radius:2px;
    display:none;
  }
  .scrollbar.visible{ display:block; }
  .scrollbar .thumb{
    position:absolute; left:0; right:0; min-height:14px;
    background:var(--accent); border-radius:2px;
    box-shadow:0 0 4px -1px var(--accent);
  }
  @keyframes fdt-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){ .d-cell{ animation:none!important; } }
  .d-cell{
    animation:fdt-in .22s ease-out both;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    min-width:0; padding:2px 1px;
  }
  .d-icon-wrap{
    position:relative; width:40px; height:40px; flex:0 0 auto; box-sizing:border-box;
    border-radius:6px;
    background:rgba(255,255,255,0.06);
    border:2px solid var(--rc, var(--r-base));
    box-shadow:0 0 5px -1px var(--rc, transparent);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .d-icon-wrap img{
    width:100%; height:100%; object-fit:contain;
    transform:scale(1.3);
  }
  .d-name{
    font-size:9px; font-weight:700; color:#f2f6f4; text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,0.9);
    line-height:1.15;
    max-width:100%; overflow:hidden;
    /* wraps to a 2nd line rather than an ellipsis — only a couple of long
       all-caps names (SENATE HOVERCAM, IMPERIAL PROBE) ever need it */
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .d-owned{
    font-family:'IBM Plex Mono',monospace;
    font-size:7.5px; font-weight:600; text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,0.9);
    opacity:0.85;
  }
  .empty-msg{
    grid-column:1/-1; display:flex; align-items:center; justify-content:center;
    color:#dfe8e2; font-size:11.5px; text-align:center; line-height:1.4;
    padding:8px;
  }
  /* an empty list fills the viewport so its message sits centered, not stuck at the top */
  .list-inner:has(.empty-msg){ height:100%; align-content:stretch; }
  /* Tier filter pills — same idea and same underlying settings as declutter.html's
     (see the tier filtering note in render() below): only shown while at least one
     tier is hidden, display-only, toggled via the shared tier hotkeys or the tier
     buttons in ⚙ Overlay Settings. */
  .tier-pills{ display:none; gap:3px; flex-wrap:wrap; margin-top:-2px; }
  .tier-pills.visible{ display:flex; }
  .tier-pill{
    font-size:8.5px; font-weight:800; letter-spacing:.03em; line-height:1;
    padding:2px 6px; border-radius:999px;
    color:#08130d; background:var(--tc);
  }
  .tier-pill.off{ background:transparent; color:rgba(255,255,255,0.35); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.18); text-decoration:line-through; }
</style>
<link rel="stylesheet" href="sw-texture.css">
</head>
<body>
  <div class="panel">
    <div class="drag-handle" id="dragHandle">
      <span>Drag to position, then Lock</span>
      <button id="lockBtn">Lock</button>
    </div>
    <div class="card">
      <h1>
        <span>🧬 Rebirth Requirements</span>
        <span class="tags"><span class="cycle-tag" id="cycleTag">Cycle 1</span><span class="count" id="countTag">0</span></span>
      </h1>
      <div class="tier-pills" id="tierPills"></div>
      <div class="list-wrap">
        <div class="list-viewport" id="viewport"><div class="list-inner" id="grid"></div></div>
        <div class="scrollbar" id="scrollbar"><div class="thumb" id="scrollThumb"></div></div>
      </div>
    </div>
  </div>

<script src="icons-data.js"></script>
<script src="droid-data.js"></script>
<script src="requirements.js"></script>
<script src="overlay-scroll.js"></script>
<script>
(function(){
  if(!window.overlayAPI){
    document.body.innerHTML = '<div style="color:#fff;padding:10px;font:12px sans-serif;">Open this file through the Fuzzy\'s Droid Tracker app, not directly in a browser.</div>';
    return;
  }

  /* ---------------------------------------------------------------------------
     A standalone, always-on-top "what do I still need" checklist for the
     active cycle's Rebirth Requirements, added 2026-09-20 so it's reachable
     with a hotkey while in-game, without alt-tabbing to the tracker window.
     cycleCeilings() (from requirements.js — the exact same function the
     tracker's own 🧬 side panel is built from) gives each droid's highest
     required rarity this cycle; render() below filters that down to only
     droids NOT YET owned at that rarity, so a droid drops off the instant
     you log it at (or above) what this cycle needs, and only reappears if
     the active cycle changes to one with a higher requirement than what you
     currently own. (The first shipped version showed the whole roster,
     owned and unowned together, dimming the owned ones instead of hiding
     them — fixed same-day after real testing showed that wasn't the point
     of the overlay.) Rendering + the live-update wiring below follows the
     same pattern as declutter.html.
  --------------------------------------------------------------------------- */

  const DOT_COLOR = { B:'var(--r-base)', G:'var(--r-gold)', D:'var(--r-diamond)', R:'var(--r-rainbow2)', K:'var(--r-beskar)', X:'var(--r-galactic)', S:'var(--r-stellar)' };

  let currentCycle = 1;
  let ownedRankLocal = {};

  async function loadIndexData(){
    nameMerges = (await window.overlayAPI.storeGet('rebirth-nameMerges')) || {};
    displayOverrides = (await window.overlayAPI.storeGet('rebirth-displayOverrides')) || {};
    buildIndex();
  }

  async function loadProgress(){
    currentCycle = (await window.overlayAPI.storeGet('rebirth-activeCycle')) || 1;
    ownedRankLocal = (await window.overlayAPI.storeGet('rebirth-ownedRank-v2')) || {};
  }

  // Only ever called with droids render() has already filtered to "still
  // needed" (owned rank below this cycle's ceiling rank for that droid), so
  // there's no owned/covered cell state to render here — every card shown
  // is something still on the list. ownedCode/haveText still matters for a
  // partially-progressed droid (e.g. cycle wants Stellar, you already have
  // Beskar): that's still needed, but "Have: Beskar" is useful progress info.
  function cellHtml(nk, info){
    const entry = DROID_INDEX[nk];
    const display = entry ? entry.display : nk;
    const rank = info.rank;
    const code = RARITY_ORDER[rank];
    const reqColor = DOT_COLOR[code] || 'var(--r-base)';
    const owned = ownedRankLocal[nk];
    const ownedCode = (owned !== undefined) ? RARITY_ORDER[owned] : null;
    const ownedColor = ownedCode ? (DOT_COLOR[ownedCode] || 'var(--r-base)') : 'rgba(255,255,255,0.5)';
    const haveText = ownedCode ? ('Have: ' + RNAME[ownedCode]) : 'Not owned';
    const iconKey = info.cycle + '-' + info.level + '-' + info.slot;
    const src = (typeof ICONS !== 'undefined' && ICONS[iconKey]) ? ('data:image/webp;base64,' + ICONS[iconKey]) : '';
    const imgTag = src ? ('<img src="' + src + '" alt="' + display + '" loading="lazy">') : '';
    const title = display + ' — need ' + RNAME[code] + ' — ' + (ownedCode ? ('you have ' + RNAME[ownedCode]) : 'not logged yet');
    return '<div class="d-cell" title="' + title + '">' +
      '<div class="d-icon-wrap" style="--rc:' + reqColor + ';">' + imgTag + '</div>' +
      '<div class="d-name">' + display + '</div>' +
      '<div class="d-owned" style="color:' + ownedColor + '">' + haveText + '</div>' +
    '</div>';
  }

  /* Scroll viewport — the paging/scrollbar logic lives in overlay-scroll.js
     (shared by both scrollable overlays); this window only supplies its own
     elements. v1.7.3: also shares declutter.html's own hotkey names
     ('declutterScrollUp'/'declutterScrollDown') instead of a separate
     'rebirthReqScrollUp'/'rebirthReqScrollDown' pair, so one hotkey binding
     pages whichever of Safe to Retire / Rebirth Requirements is open — same
     fix as the v1.7.2 tier filter, and for the same reason (main.js's
     broadcast() already reaches every window; this overlay just wasn't
     listening for the shared event name). */
  const viewport = document.getElementById('viewport');
  const scroller = createScrollViewport(viewport, document.getElementById('scrollbar'), document.getElementById('scrollThumb'), '.d-cell');
  const updateScrollbar = scroller.update;

  window.overlayAPI.onHotkeyTriggered((name)=>{
    if(name === 'declutterScrollUp') scroller.page(-1);
    else if(name === 'declutterScrollDown') scroller.page(1);
  });

  // Which rarity CLASSES to show — v1.7.2: shares the exact same settings
  // keys (and therefore the exact same hotkeys / ⚙ Overlay Settings buttons)
  // as Safe to Retire's tier filter (declutter.html), rather than this
  // overlay getting its own separate set. One filter, controlled from one
  // place, applies to both "which droids can I retire" and "which droids do
  // I still need" — flipping Mythic off because you're drowning in Mythic
  // reminders hides it here too, no second binding to set up. Re-read on
  // every settings:changed, same pattern as declutter.html.
  const TIER_SETTING = { Mythic:'declutterShowMythic', Legendary:'declutterShowLegendary', Epic:'declutterShowEpic', Rare:'declutterShowRare', Default:'declutterShowDefault' };
  let tiersOn = { Default:true, Rare:true, Epic:true, Legendary:true, Mythic:true };

  // Same guard as declutter.html: nothing renders until the first
  // fullReload() has built the droid index, so an early store:changed can't
  // paint a list with raw normalized keys instead of display names.
  let loaded = false;

  function renderTierPills(){
    const el = document.getElementById('tierPills');
    const anyOff = Object.keys(TIER_SETTING).some(t => !tiersOn[t]);
    el.classList.toggle('visible', anyOff);
    if(!anyOff){ el.innerHTML = ''; return; }
    el.innerHTML = Object.keys(TIER_SETTING).map(t =>
      '<span class="tier-pill' + (tiersOn[t] ? '' : ' off') + '" style="--tc:var(--rarity-' + t.toLowerCase() + ')">' + t + '</span>'
    ).join('');
  }

  function render(){
    if(!loaded) return;
    const gridEl = document.getElementById('grid');
    const countTag = document.getElementById('countTag');
    const cycleTag = document.getElementById('cycleTag');
    cycleTag.textContent = 'Cycle ' + currentCycle;

    const ceilings = cycleCeilings(currentCycle);
    // Still-needed only: drop any droid already owned at (or above) the
    // rarity this cycle requires it at. Fixed 2026-09-20 — the first
    // shipped version showed the whole cycle roster, owned droids included.
    const allNks = Object.keys(ceilings).filter(nk=>{
      const owned = ownedRankLocal[nk];
      return owned === undefined || owned < ceilings[nk].rank;
    });
    // Tier filter (v1.7.2): getDroidRarityClass(nk) is the same droid-class
    // lookup getDeclutterList() uses for Safe to Retire, checked against the
    // same tiersOn state above.
    const nks = allNks.filter(nk => tiersOn[getDroidRarityClass(nk)] !== false)
      .sort((a,b)=>{
        const ra = ceilings[a].rank, rb = ceilings[b].rank;
        if(ra !== rb) return ra - rb;
        const da = DROID_INDEX[a] ? DROID_INDEX[a].display : a;
        const db = DROID_INDEX[b] ? DROID_INDEX[b].display : b;
        return da.localeCompare(db);
      });
    countTag.textContent = String(nks.length);
    if(!nks.length){
      const hiddenByTier = allNks.length - nks.length;
      gridEl.innerHTML = '<div class="empty-msg">' +
        (hiddenByTier ? (hiddenByTier + ' droid' + (hiddenByTier === 1 ? '' : 's') + ' hidden by the tier filter — turn tiers back on with their hotkeys or in ⚙ Overlay Settings.')
                      : 'Every droid this cycle needs is already covered 🎉') +
        '</div>';
      updateScrollbar();
      return;
    }
    gridEl.innerHTML = nks.map(nk=>cellHtml(nk, ceilings[nk])).join('');
    updateScrollbar();
  }

  async function fullReload(){
    await loadIndexData();
    await loadProgress();
    loaded = true;
    render();
  }

  window.overlayAPI.onStoreChanged(({ key, value })=>{
    if(key === 'rebirth-ownedRank-v2'){ ownedRankLocal = value || {}; render(); }
    else if(key === 'rebirth-activeCycle'){ currentCycle = value || 1; scroller.toTop(); render(); } // new cycle = new list, start at the top
    else if(key === 'rebirth-nameMerges' || key === 'rebirth-displayOverrides'){ fullReload(); }
  });

  function applySettings(settings){
    document.body.classList.toggle('unlocked', !settings.rebirthReqLocked);
    // v1.9.0: this overlay's own saber color, picked in ⚙ Overlay Settings →
    // Colors. SABER_COLORS comes from requirements.js, loaded above.
    const saber = SABER_COLORS[settings.rebirthReqColor] || SABER_COLORS.purple;
    document.documentElement.style.setProperty('--accent', saber.hex);
    document.documentElement.style.setProperty('--sw-rgb', saber.rgb);
    let changed = false;
    Object.keys(TIER_SETTING).forEach(t=>{
      const v = settings[TIER_SETTING[t]] !== false;
      if(tiersOn[t] !== v){ tiersOn[t] = v; changed = true; }
    });
    if(changed){ renderTierPills(); render(); }
  }
  window.overlayAPI.onSettingsChanged(applySettings);

  document.getElementById('lockBtn').addEventListener('click', ()=>{
    window.overlayAPI.setRebirthReqLocked(true);
  });

  (async function init(){
    const settings = await window.overlayAPI.getSettings();
    applySettings(settings);
    await fullReload();
  })();
})();
</script>
</body>
</html>
