<!DOCTYPE html>
<html lang="en" data-ov-name="sneak" data-mark-list="sneak">
<head>
<meta charset="UTF-8">
<title>Fuzzy's Droid Tracker — Sneak Preview</title>
<link rel="stylesheet" href="fonts/fonts.css"><!-- v1.19.0: shipped with the app, was Google Fonts -->
<link rel="stylesheet" href="overlay-theme.css">
<style>
  :root{
    --r-base: #9aa39d;
    --r-gold: #e8c04a;
    --r-diamond: #4fd3e8;
    --r-rainbow1: #ff6ec7;
    --r-rainbow2: #6ecbff;
    --r-beskar: #b9c2cc;
    --r-galactic: #c96bf2;
    --r-stellar: #e08a3c;
    --r-kyber: #50c878; /* confirmed 2026-09-26 from in-game Kyber cards (emerald), see timers.html --kyber */
    --accent: #ff4d6d; /* v1.9.0: this overlay's own lightsaber color — red, matches the Mythic tier color since this list is Mythic-only */
    --sw-rgb: 255,77,109;
  }
  html,body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;
    width:100%; height:100%;
  }
  .panel{
    position:relative;
    display:flex; flex-direction:column; gap:6px;
    width:100%; height:100%; box-sizing:border-box;
    padding:24px 6px 6px; /* extra top room for .border-badge, see below */
  }
  /* Border badge (v1.10.0): see overlay.html's matching comment. */
  .border-badge{
    position:absolute; top:9px; left:50%; transform:translateX(-50%);
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#0c1210; border:2px solid var(--accent); color:var(--accent);
    box-shadow:0 0 8px -2px var(--accent);
    z-index:3;
  }
  .drag-handle{
    display:none;
    cursor:move; touch-action:none; /* moved by overlay-drag.js, never -webkit-app-region */
    align-items:center; justify-content:space-between;
    background:rgba(94,242,166,0.22);
    border:1px solid rgba(94,242,166,0.55);
    border-radius:6px;
    padding:4px 8px;
    font-size:11px;
    color:#eafff3;
    letter-spacing:.02em;
  }
  body.unlocked .drag-handle{ display:flex; }
  .drag-handle button{
    background:var(--accent); color:#08130d; border:none; border-radius:4px;
    font-size:11px; font-weight:700; padding:3px 9px; cursor:pointer;
  }
  .card{
    flex:1; min-height:0; display:flex; flex-direction:column; gap:6px;
    background:rgba(var(--ov-backdrop-rgb), var(--ov-backdrop-alpha));
    border:1px solid rgba(255,255,255,0.14);
    border-top:3px solid var(--accent);
    border-radius:10px;
    padding:8px 9px;
    box-sizing:border-box;
    overflow:hidden;
  }
  .card h1{
    margin:0; font-size:11px; font-weight:800; letter-spacing:.05em;
    color:#eafff3; text-transform:uppercase;
    text-shadow:0 1px 2px rgba(0,0,0,0.9);
    display:flex; align-items:center; justify-content:space-between;
    gap:6px;
  }
  .card h1 .tags{ display:flex; align-items:center; gap:5px; flex:0 0 auto; }
  .card h1 .cycle-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px; font-weight:700; color:#dfe8e2;
    background:rgba(255,255,255,0.12); border-radius:999px;
    padding:1px 7px; letter-spacing:0; text-transform:none;
  }
  .card h1 .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; font-weight:700; color:#08130d;
    background:var(--accent); border-radius:999px;
    padding:1px 7px; letter-spacing:0;
  }
  /* ---------------------------------------------------------------------
     Redesigned 2026-09-23 alongside declutter.html — see the matching
     comment there. Fixed-size icons, auto-filled columns, natural row
     height, and a hotkey-scrolled viewport (sneakScrollUp/Down,
     unbound by default) replace the old divide-the-height-into-N-rows grid
     and its pickCols() column tiers, which either crushed the icon (a fresh
     cycle's full 43-49 roster) or blew it up (a short list). Sorted lowest-
     to-highest required rarity so the parts you'll clear first stay
     together, matching the tracker's own Rebirth Requirements panel. */
  .list-wrap{ position:relative; flex:1; min-height:0; display:flex; }
  .list-viewport{
    position:relative; /* offsetParent for overlay-scroll.js's row math */
    flex:1; min-height:0; overflow:hidden;
    padding-right:8px; box-sizing:border-box;
  }
  .list-inner{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(calc(var(--ov-icon-size) * 2), 1fr));
    gap:5px 4px;
    align-content:start;
  }
  .scrollbar{
    position:absolute; top:0; right:0; bottom:0; width:4px;
    background:rgba(255,255,255,0.08); border-radius:2px;
    display:none;
  }
  .scrollbar.visible{ display:block; }
  .scrollbar .thumb{
    position:absolute; left:0; right:0; min-height:14px;
    background:var(--accent); border-radius:2px;
    box-shadow:0 0 4px -1px var(--accent);
  }
  @keyframes fdt-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){ .d-cell{ animation:none!important; } }
  .d-cell{
    animation:fdt-in .22s ease-out both;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    min-width:0; padding:2px 1px;
    pointer-events:auto; cursor:pointer;
  }
  /* v1.10.13: hotkey selection, same look as Rebirth Requirements but in this overlay's own border color */
  .d-cell.selected{
    border-radius:8px;
    box-shadow:0 0 12px 0 rgba(var(--ov-highlight-rgb), 1), inset 0 0 8px -2px rgba(var(--ov-highlight-rgb), 0.3);
  }
  .d-cell.selected .d-icon-wrap{
    box-shadow:0 0 12px -1px var(--accent);
    transform:scale(1.05);
    transition:transform 0.1s ease;
  }
  /* Held for the next cycle (marked here, not yet applied) */
  .d-held{
    position:absolute; top:1px; right:1px;
    width:13px; height:13px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:9px; font-weight:800; line-height:1;
    color:#08130d; background:var(--accent);
    box-shadow:0 0 4px -1px var(--accent);
  }
  .d-icon-wrap{
    position:relative; width:var(--ov-icon-size); height:var(--ov-icon-size); flex:0 0 auto; box-sizing:border-box;
    border-radius:6px;
    background:rgba(var(--ov-box-rgb), var(--ov-box-alpha));
    border:2px solid var(--rc, var(--r-base));
    box-shadow:0 0 5px -1px var(--rc, transparent);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .d-icon-wrap img{
    width:100%; height:100%; object-fit:cover;
  }
  .d-name{
    font-size:calc(9px * var(--ov-text-scale, 1)); font-weight:700; color:#f2f6f4; text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,0.9);
    line-height:1.15;
    max-width:100%; overflow:hidden;
    /* wraps to a 2nd line rather than an ellipsis — only a couple of long
       all-caps names (SENATE HOVERCAM, IMPERIAL PROBE) ever need it */
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .d-owned{
    font-family:'IBM Plex Mono',monospace;
    font-size:calc(7.5px * var(--ov-text-scale, 1)); font-weight:600; text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,0.9);
    opacity:0.85;
  }
  .empty-msg{
    grid-column:1/-1; display:flex; align-items:center; justify-content:center;
    color:#dfe8e2; font-size:11.5px; text-align:center; line-height:1.4;
    padding:8px;
  }
  /* an empty list fills the viewport so its message sits centered, not stuck at the top */
  .list-inner:has(.empty-msg){ height:100%; align-content:stretch; }
</style>
<link rel="stylesheet" href="sw-texture.css">
</head>
<body>
  <div class="panel">
    <div class="border-badge" id="borderBadge"></div>
    <div class="drag-handle" id="dragHandle">
      <span>Drag to move, corner to resize, then Lock</span>
      <button id="lockBtn">Lock</button>
    </div>
    <div class="card">
      <h1>
        <span>🔮 Sneak Preview</span>
        <span class="tags"><span class="cycle-tag" id="cycleTag">Next: Cycle 2</span><span class="count" id="countTag">0</span></span>
      </h1>
      <div class="list-wrap">
        <div class="list-viewport" id="viewport"><div class="list-inner" id="grid"></div></div>
        <div class="scrollbar" id="scrollbar"><div class="thumb" id="scrollThumb"></div></div>
      </div>
    </div>
  </div>

<script src="card-icons-data.js"></script>
<script src="droid-data.js"></script>
<script src="requirements.js"></script>
<script src="overlay-scroll.js"></script>
<script>
(function(){
  if(!window.overlayAPI){
    document.body.innerHTML = '<div style="color:#fff;padding:10px;font:12px sans-serif;">Open this file through the Fuzzy\'s Droid Tracker app, not directly in a browser.</div>';
    return;
  }

  /* ---------------------------------------------------------------------------
     Sneak Preview (v1.6.1): the Mythic-class droids the NEXT cycle will
     require, each at the highest variety that cycle ever asks for, highest
     first. Data comes from getSneakPreview() in requirements.js. Same card
     template, default size/position and hotkey-scrolled viewport as the
     Rebirth Requirements overlay. Shown automatically by tracker.html when a
     cycle hits 105/105 and the player picks "Sneak Preview" in the prompt
     (that cycle is reset first, so "✓ Have" only reflects what's still
     logged), and by its own (unbound-by-default) hotkey / toolbar button
     otherwise.

     Marking (v1.10.13): same rebirthMark* keys and click-to-mark as the
     Rebirth Requirements overlay (main.js routes the keys to whichever of
     the two is on screen). A mark here is HELD for the previewed cycle in
     'rebirth-heldMarks', not written to ownedRank — see mergeHeldMarks() in
     requirements.js for why — and tracker.html applies it when that cycle
     becomes active. Marking a held droid again un-holds it.
  --------------------------------------------------------------------------- */

  const DOT_COLOR = { B:'var(--r-base)', G:'var(--r-gold)', D:'var(--r-diamond)', R:'var(--r-rainbow2)', K:'var(--r-beskar)', X:'var(--r-galactic)', S:'var(--r-stellar)', Y:'var(--r-kyber)' };

  let currentCycle = 1;
  let ownedRankLocal = {};
  let heldLocal = {};      // 'rebirth-heldMarks': {cycle -> {nk -> rank}}
  let shown = { nextCycle: 2, items: [] }; // what render() last drew, in cell order
  let selectedIndex = 0;

  async function loadIndexData(){
    nameMerges = (await window.overlayAPI.storeGet('rebirth-nameMerges')) || {};
    displayOverrides = (await window.overlayAPI.storeGet('rebirth-displayOverrides')) || {};
    buildIndex();
  }

  async function loadProgress(){
    currentCycle = (await window.overlayAPI.storeGet('rebirth-activeCycle')) || 1;
    ownedRankLocal = (await window.overlayAPI.storeGet('rebirth-ownedRank-v2')) || {};
    heldLocal = (await window.overlayAPI.storeGet('rebirth-heldMarks')) || {};
  }

  function cellHtml(it, i, nextCycle){
    const reqColor = DOT_COLOR[it.code] || 'var(--r-base)';
    const heldRank = (heldLocal[nextCycle] || {})[it.nk];
    const held = heldRank !== undefined && heldRank >= it.rank;
    // "covered" = the variety already logged for this droid (any cycle) is
    // at or above what next cycle will ask for — you don't need to hunt for
    // it, just hang onto what you've got. Compared by rank (not code
    // string) since ownedCode/code are letters, not numbers.
    const covered = it.ownedCode != null && rankOf(it.ownedCode) >= it.rank;
    const ownedColor = (held || covered) ? 'var(--accent)' : (it.ownedCode ? (DOT_COLOR[it.ownedCode] || 'var(--r-base)') : 'rgba(255,255,255,0.5)');
    const statusText = held ? ('✓ Marked ' + RNAME[it.code]) : covered ? ('✓ Have ' + RNAME[it.ownedCode]) : ('Needs ' + RNAME[it.code]);
    const b64 = (typeof CARD_ICONS !== 'undefined' && CARD_ICONS[it.iconKey]) || (typeof ICONS !== 'undefined' && ICONS[it.iconKey]);
    const src = b64 ? 'data:image/webp;base64,' + b64 : '';
    const imgTag = src ? ('<img src="' + src + '" alt="' + it.display + '" loading="lazy">') : '';
    const title = it.display + ' — next cycle needs ' + RNAME[it.code] + ' — ' +
      (held ? ('marked for Cycle ' + nextCycle + ', applied when you switch to it')
            : ((it.ownedCode ? ('you have ' + RNAME[it.ownedCode]) : 'not logged yet') + (covered ? ' (already covered)' : '')));
    return '<div class="d-cell" data-index="' + i + '" title="' + title + '">' +
      '<div class="d-icon-wrap" style="--rc:' + reqColor + ';">' + imgTag + (held ? '<span class="d-held">✓</span>' : '') + '</div>' +
      '<div class="d-name">' + it.display + '</div>' +
      // v1.17.0: 'Needs …' is the one state that names the rarity the next cycle asks for; 'Written under
      // the name' colours it by that rarity (--nc) instead of by what you hold
      '<div class="d-owned' + ((held || covered) ? '' : ' need') + '" style="color:' + ownedColor + ';--nc:' + reqColor + '">' + statusText + '</div>' +
    '</div>';
  }

  /* Scroll viewport — the paging/scrollbar logic lives in overlay-scroll.js
     (shared by both scrollable overlays); this window only supplies its own
     elements and hotkey names. */
  const viewport = document.getElementById('viewport');
  const scroller = createScrollViewport(viewport, document.getElementById('scrollbar'), document.getElementById('scrollThumb'), '.d-cell');
  const updateScrollbar = scroller.update;

  window.overlayAPI.onHotkeyTriggered((name)=>{
    if(name === 'sneakScrollUp') scroller.page(-1);
    else if(name === 'sneakScrollDown') scroller.page(1);
    else if(name === 'rebirthMarkLeft') moveSelection(-1);
    else if(name === 'rebirthMarkRight') moveSelection(1);
    else if(name === 'rebirthMarkUp') moveSelection(-columnCount());
    else if(name === 'rebirthMarkDown') moveSelection(columnCount());
    else if(name === 'rebirthMarkDroid') markItem(selectedIndex);
  });

  const gridEl = document.getElementById('grid');

  // Cells in one grid row share an offsetTop, so count the first row's.
  function columnCount(){
    const cells = gridEl.querySelectorAll('.d-cell');
    let cols = 1;
    while(cols < cells.length && cells[cols].offsetTop === cells[0].offsetTop) cols++;
    return cols;
  }

  function applySelection(){
    const cells = gridEl.querySelectorAll('.d-cell');
    cells.forEach(c => c.classList.remove('selected'));
    if(cells[selectedIndex]) cells[selectedIndex].classList.add('selected');
  }

  function moveSelection(delta){
    if(!shown.items.length) return;
    selectedIndex = Math.max(0, Math.min(shown.items.length - 1, selectedIndex + delta));
    applySelection();
    const cell = gridEl.querySelectorAll('.d-cell')[selectedIndex];
    if(cell) scroller.reveal(cell);
  }

  function markItem(i){
    const it = shown.items[i];
    if(!it) return;
    window.overlayAPI.holdNextCycleMark({ cycle: shown.nextCycle, nk: it.nk, rank: it.rank });
  }

  // Clicks only reach the cells while the overlay is unlocked (locked = click-through).
  gridEl.addEventListener('click', (e)=>{
    const cell = e.target.closest('.d-cell');
    if(!cell) return;
    selectedIndex = parseInt(cell.dataset.index, 10);
    applySelection();
    markItem(selectedIndex);
  });

  // Same guard as declutter.html: nothing renders until the first
  // fullReload() has built the droid index, so an early store:changed can't
  // paint a list with raw normalized keys instead of display names.
  let loaded = false;

  function render(){
    if(!loaded) return;
    shown = getSneakPreview(currentCycle, ownedRankLocal);
    const { nextCycle, items } = shown;
    document.getElementById('cycleTag').textContent = 'Next: Cycle ' + nextCycle;
    document.getElementById('countTag').textContent = String(items.length);
    gridEl.innerHTML = items.length
      ? items.map((it, i) => cellHtml(it, i, nextCycle)).join('')
      : '<div class="empty-msg">No Mythic droids in Cycle ' + nextCycle + "'s requirements</div>";
    selectedIndex = Math.min(selectedIndex, Math.max(0, items.length - 1));
    applySelection();
    updateScrollbar();
  }

  async function fullReload(){
    await loadIndexData();
    await loadProgress();
    loaded = true;
    render();
  }

  window.overlayAPI.onStoreChanged(({ key, value })=>{
    if(key === 'rebirth-ownedRank-v2'){ ownedRankLocal = value || {}; render(); }
    else if(key === 'rebirth-heldMarks'){ heldLocal = value || {}; render(); }
    else if(key === 'rebirth-activeCycle'){ currentCycle = value || 1; selectedIndex = 0; scroller.toTop(); render(); } // new cycle = new list, start at the top
    else if(key === 'rebirth-nameMerges' || key === 'rebirth-displayOverrides'){ fullReload(); }
  });

  function applySettings(settings){
    document.body.classList.toggle('unlocked', !settings.sneakLocked);
    // v1.10.0: this overlay's own border skin, picked in ⚙ Overlay Settings →
    // Borders. BORDER_SKINS/borderIconSvg come from requirements.js, loaded above.
    const skin = BORDER_SKINS[settings.sneakBorder] || BORDER_SKINS.rebel;
    document.documentElement.style.setProperty('--accent', skin.hex);
    document.documentElement.style.setProperty('--sw-rgb', skin.rgb);
    const badge = document.getElementById('borderBadge');
    if(badge) badge.innerHTML = borderIconSvg(settings.sneakBorder || 'rebel', 18);
  }
  window.overlayAPI.onSettingsChanged(applySettings);

  document.getElementById('lockBtn').addEventListener('click', ()=>{
    window.overlayAPI.setSneakLocked(true);
  });

  (async function init(){
    const settings = await window.overlayAPI.getSettings();
    applySettings(settings);
    await fullReload();
  })();
})();
</script>
<script src="overlay-theme.js"></script>
<script src="overlay-drag.js"></script>
</body>
</html>
