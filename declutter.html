<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fuzzy's Droid Tracker — Declutter List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --r-base: #9aa39d;
    --r-gold: #e8c04a;
    --r-diamond: #4fd3e8;
    --r-rainbow1: #ff6ec7;
    --r-rainbow2: #6ecbff;
    --r-beskar: #b9c2cc;
    --r-galactic: #c96bf2;
    --r-stellar: #e08a3c;
    --r-kyber: #50c878; /* confirmed 2026-09-26 from in-game Kyber cards (emerald), see timers.html --kyber */
    --rarity-default: #9aa39d;
    --rarity-rare: #4fa3e8;
    --rarity-epic: #b06cf2;
    --rarity-legendary: #f4a93b;
    --rarity-mythic: #ff4d6d;
    --accent: #5ef2a6; /* v1.9.0: this overlay's own lightsaber color — green, "safe to retire" */
    --sw-rgb: 94,242,166;
  }
  html,body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;
    width:100%; height:100%;
  }
  .panel{
    position:relative;
    display:flex; flex-direction:column; gap:6px;
    width:100%; height:100%; box-sizing:border-box;
    padding:24px 6px 6px; /* extra top room for .border-badge, see below */
  }
  /* Border badge (v1.10.0): see overlay.html's matching comment. */
  .border-badge{
    position:absolute; top:9px; left:50%; transform:translateX(-50%);
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#0c1210; border:2px solid var(--accent); color:var(--accent);
    box-shadow:0 0 8px -2px var(--accent);
    z-index:3;
  }
  .drag-handle{
    display:none;
    -webkit-app-region: drag;
    align-items:center; justify-content:space-between;
    background:rgba(94,242,166,0.22);
    border:1px solid rgba(94,242,166,0.55);
    border-radius:6px;
    padding:4px 8px;
    font-size:11px;
    color:#eafff3;
    letter-spacing:.02em;
  }
  body.unlocked .drag-handle{ display:flex; }
  .drag-handle button{
    -webkit-app-region: no-drag;
    background:var(--accent); color:#08130d; border:none; border-radius:4px;
    font-size:11px; font-weight:700; padding:3px 9px; cursor:pointer;
  }
  .card{
    flex:1; min-height:0; display:flex; flex-direction:column; gap:6px;
    background:rgba(10,14,12,0.62);
    border:1px solid rgba(255,255,255,0.14);
    border-top:3px solid var(--accent);
    border-radius:10px;
    padding:8px 9px;
    box-sizing:border-box;
    overflow:hidden;
  }
  .card h1{
    margin:0; font-size:11px; font-weight:800; letter-spacing:.05em;
    color:#eafff3; text-transform:uppercase;
    text-shadow:0 1px 2px rgba(0,0,0,0.9);
    display:flex; align-items:center; justify-content:space-between;
    gap:6px;
  }
  .card h1 .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; font-weight:700; color:#08130d;
    background:var(--accent); border-radius:999px;
    padding:1px 7px; letter-spacing:0;
  }
  .card h1 .tags{ display:flex; align-items:center; gap:5px; flex:0 0 auto; }
  /* v1.10.13: only while retired droids are hidden, so a short list isn't a mystery */
  .card h1 .retired-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px; font-weight:700; color:#dfe8e2;
    background:rgba(255,255,255,0.12); border-radius:999px;
    padding:1px 7px; letter-spacing:0; text-transform:none;
  }
  /* ---------------------------------------------------------------------
     Redesigned 2026-09-23 to match the "Upcoming RB Req's" HUD's clean
     look (overlay.html): that HUD never looked bulky because its icons are
     a small, FIXED size regardless of how few cards are on screen — the
     old grid here instead divided this panel's fixed height into exactly
     as many equal rows as the current count needed (see the git history
     for the removed pickCols()/rows math), so a short list handed each row
     a huge 1fr share and the old 118px icon cap happily filled it
     ("bulky... large and pixelated"). Fixed instead: icons are a small,
     constant size (see .d-icon-wrap below, no cap-that-can-still-grow),
     the grid auto-fills as many fixed-ish-width columns as the window's
     actual width allows (no more hand-tuned column-count tiers), and rows
     size themselves from content instead of stretching. A list that's
     taller than the visible area no longer needs to shrink to fit — it
     scrolls instead, moved by two new hotkeys (unbound by default, bind
     them in ⚙ Overlay Settings) since a locked overlay is click-through by
     design and a mouse can't reach it. See .list-wrap/#viewport/#scrollbar
     and overlay-scroll.js (shared with rebirth-requirements-overlay.html). */
  .list-wrap{ position:relative; flex:1; min-height:0; display:flex; }
  .list-viewport{
    position:relative; /* offsetParent for overlay-scroll.js's row math */
    flex:1; min-height:0; overflow:hidden;
    padding-right:8px; box-sizing:border-box;
  }
  .list-inner{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(80px, 1fr));
    gap:5px 4px;
    align-content:start;
  }
  .scrollbar{
    position:absolute; top:0; right:0; bottom:0; width:4px;
    background:rgba(255,255,255,0.08); border-radius:2px;
    display:none;
  }
  .scrollbar.visible{ display:block; }
  .scrollbar .thumb{
    position:absolute; left:0; right:0; min-height:14px;
    background:var(--accent); border-radius:2px;
    box-shadow:0 0 4px -1px var(--accent);
  }
  @keyframes fdt-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){ .d-cell{ animation:none!important; } }
  .d-cell{
    animation:fdt-in .22s ease-out both;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    min-width:0; padding:2px 1px;
    pointer-events:auto; cursor:pointer;
  }
  /* v1.10.13: hotkey selection, in this overlay's own border color */
  .d-cell.selected{
    border-radius:8px;
    box-shadow:0 0 12px 0 rgba(var(--sw-rgb), 1), inset 0 0 8px -2px rgba(var(--sw-rgb), 0.3);
  }
  .d-cell.selected .d-icon-wrap{
    box-shadow:0 0 12px -1px var(--accent);
    transform:scale(1.05);
    transition:transform 0.1s ease;
  }
  /* Retired: dimmed at the bottom, mark again to undo. Dims the children, not
     the cell — fdt-in's fill-mode holds the cell's own opacity at 1. */
  .d-cell.retired > *{ opacity:0.4; }
  .d-cell.retired .d-icon-wrap img{ filter:grayscale(1); }
  .d-cell.retired .d-name{ text-decoration:line-through; }
  .d-icon-wrap{
    position:relative; width:40px; height:40px; flex:0 0 auto; box-sizing:border-box;
    border-radius:6px;
    background:rgba(255,255,255,0.06);
    border:2px solid var(--rc, var(--r-base));
    box-shadow:0 0 5px -1px var(--rc, transparent);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .d-icon-wrap img{
    width:100%; height:100%; object-fit:cover;
  }
  .d-icon-wrap.default{ --rc: var(--rarity-default); }
  .d-icon-wrap.rare{ --rc: var(--rarity-rare); }
  .d-icon-wrap.epic{ --rc: var(--rarity-epic); }
  .d-icon-wrap.legendary{ --rc: var(--rarity-legendary); }
  .d-icon-wrap.mythic{ --rc: var(--rarity-mythic); }
  .d-rarity-dot{
    position:absolute; top:2px; right:2px;
    width:7px; height:7px; border-radius:50%;
    background:var(--rc, var(--r-base));
    border:1px solid rgba(0,0,0,0.5);
  }
  .d-name{
    font-size:9px; font-weight:700; color:#f2f6f4; text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,0.9);
    line-height:1.15;
    max-width:100%; overflow:hidden;
    /* wraps to a 2nd line rather than an ellipsis — only a couple of long
       all-caps names (SENATE HOVERCAM, IMPERIAL PROBE) ever need it */
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .d-owned{
    font-family:'IBM Plex Mono',monospace;
    font-size:7.5px; font-weight:600; text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,0.9);
    opacity:0.85;
  }
  .empty-msg{
    grid-column:1/-1; display:flex; align-items:center; justify-content:center;
    color:#dfe8e2; font-size:11.5px; text-align:center; line-height:1.4;
    padding:8px;
  }
  /* an empty list fills the viewport so its message sits centered, not stuck at the top */
  .list-inner:has(.empty-msg){ height:100%; align-content:stretch; }
  /* Tier filter pills — only shown while at least one tier is hidden, so the
     default all-tiers view stays as clean as before. Display-only (a locked
     overlay is click-through); toggling happens via the tier hotkeys or the
     tier buttons in ⚙ Overlay Settings. */
  .tier-pills{ display:none; gap:3px; flex-wrap:wrap; margin-top:-2px; }
  .tier-pills.visible{ display:flex; }
  .tier-pill{
    font-size:8.5px; font-weight:800; letter-spacing:.03em; line-height:1;
    padding:2px 6px; border-radius:999px;
    color:#08130d; background:var(--tc);
  }
  .tier-pill.off{ background:transparent; color:rgba(255,255,255,0.35); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.18); text-decoration:line-through; }
</style>
<link rel="stylesheet" href="sw-texture.css">
</head>
<body>
  <div class="panel">
    <div class="border-badge" id="borderBadge"></div>
    <div class="drag-handle" id="dragHandle">
      <span>Drag to position, then Lock</span>
      <button id="lockBtn">Lock</button>
    </div>
    <div class="card">
      <h1><span>♻ Safe to Retire</span><span class="tags"><span class="retired-tag" id="retiredTag" hidden></span><span class="count" id="countTag">0</span></span></h1>
      <div class="tier-pills" id="tierPills"></div>
      <div class="list-wrap">
        <div class="list-viewport" id="viewport"><div class="list-inner" id="grid"></div></div>
        <div class="scrollbar" id="scrollbar"><div class="thumb" id="scrollThumb"></div></div>
      </div>
    </div>
  </div>

<script src="icons-data.js"></script>
<script src="card-icons-data.js"></script>
<script src="droid-data.js"></script>
<script src="requirements.js"></script>
<script src="overlay-scroll.js"></script>
<script>
(function(){
  if(!window.overlayAPI){
    document.body.innerHTML = '<div style="color:#fff;padding:10px;font:12px sans-serif;">Open this file through the Fuzzy\'s Droid Tracker app, not directly in a browser.</div>';
    return;
  }

  /* ---------------------------------------------------------------------------
     Droids of every rarity tier (Default through Mythic — this was
     Legendary/Mythic only until v1.6.0) you've logged as owned whose
     last-needed level in the ACTIVE cycle has already been passed — i.e. nothing left in this
     cycle's requirement table will ever ask for them again, so whatever copy
     you're holding is safe to sell/dismantle/retire in-game. All of the real
     logic (which droid, which level, which rarity class) lives in
     getDeclutterList() in requirements.js so it can be verified once against
     the actual CYCLES data rather than duplicated here; this file is purely
     rendering + the same store-driven live-update pattern every other window
     in this app already uses.

     Scoped to whichever cycle is currently active (matching the Rebirth Reqs
     panel and the main HUD) — moving to a different cycle recomputes this
     list from scratch for that cycle, since each cycle has its own
     requirement table.

     Retiring (v1.10.13): the rebirthMark* keys (routed here by main.js when
     this is the most recently shown list overlay) or a click while unlocked
     mark a droid retired for this cycle — it moves to the bottom, dimmed;
     marking it again un-retires it. Stored in 'rebirth-retired', never in
     ownedRank (see isRetired() in requirements.js), so every other list and
     the cycle's coverage count are untouched.
  --------------------------------------------------------------------------- */

  let currentCycle = 1;
  let currentLevel = 0;
  let ownedRankLocal = {};
  let retiredLocal = {};  // 'rebirth-retired': {cycle -> {nk -> owned rank retired}}
  let showRetired = true; // settings.declutterShowRetired, flipped by its hotkey
  let shownList = [];     // what render() last drew, in cell order
  let selectedIndex = 0;

  async function loadIndexData(){
    nameMerges = (await window.overlayAPI.storeGet('rebirth-nameMerges')) || {};
    displayOverrides = (await window.overlayAPI.storeGet('rebirth-displayOverrides')) || {};
    buildIndex();
  }

  async function loadProgress(){
    currentCycle = (await window.overlayAPI.storeGet('rebirth-activeCycle')) || 1;
    currentLevel = (await window.overlayAPI.storeGet('rebirth-currentLevel')) || 0;
    ownedRankLocal = (await window.overlayAPI.storeGet('rebirth-ownedRank-v2')) || {};
    retiredLocal = (await window.overlayAPI.storeGet('rebirth-retired')) || {};
  }

  function itemRetired(item){
    return isRetired((retiredLocal[currentCycle] || {})[item.nk], ownedRankLocal[item.nk]);
  }

  function cellHtml(item, i){
    const b64 = (typeof CARD_ICONS !== 'undefined' && item.iconKey && CARD_ICONS[item.iconKey]) || (typeof ICONS !== 'undefined' && item.iconKey && ICONS[item.iconKey]);
    const src = b64 ? 'data:image/webp;base64,' + b64 : '';
    const imgTag = src ? ('<img src="' + src + '" alt="' + item.display + '" loading="lazy">') : '';
    const rarityClass = String(item.rarityClass || 'Default').toLowerCase();
    const ownedColorVar = 'var(--r-' + (
      item.ownedCode === 'B' ? 'base' :
      item.ownedCode === 'G' ? 'gold' :
      item.ownedCode === 'D' ? 'diamond' :
      item.ownedCode === 'R' ? 'rainbow2' :
      item.ownedCode === 'K' ? 'beskar' :
      item.ownedCode === 'X' ? 'galactic' :
      item.ownedCode === 'Y' ? 'kyber' : 'stellar' // was falling through to stellar for Kyber too, not just S
    ) + ')';
    const retired = itemRetired(item);
    const title = item.display + ' — ' + item.rarityClass + ' — you have ' + RNAME[item.ownedCode] + ' — ' +
      (retired ? 'marked retired (mark again to undo)' : 'not needed again this cycle');
    return '<div class="d-cell' + (retired ? ' retired' : '') + '" data-index="' + i + '" title="' + title + '">' +
      '<div class="d-icon-wrap ' + rarityClass + '">' + imgTag + '<span class="d-rarity-dot"></span></div>' +
      '<div class="d-name">' + item.display + '</div>' +
      '<div class="d-owned" style="color:' + ownedColorVar + '">' + (retired ? '✓ Retired' : RNAME[item.ownedCode]) + '</div>' +
    '</div>';
  }

  /* Scroll viewport — the paging/scrollbar logic lives in overlay-scroll.js
     (shared by both scrollable overlays); this window only supplies its own
     elements. v1.7.3: 'declutterScrollUp'/'declutterScrollDown' now also
     page rebirth-requirements-overlay.html (it listens for the same event
     name) — one hotkey binding controls whichever overlay is open, not
     just this one. */
  const viewport = document.getElementById('viewport');
  const scroller = createScrollViewport(viewport, document.getElementById('scrollbar'), document.getElementById('scrollThumb'), '.d-cell');
  const updateScrollbar = scroller.update;

  window.overlayAPI.onHotkeyTriggered((name)=>{
    if(name === 'declutterScrollUp') scroller.page(-1);
    else if(name === 'declutterScrollDown') scroller.page(1);
    else if(name === 'rebirthMarkLeft') moveSelection(-1);
    else if(name === 'rebirthMarkRight') moveSelection(1);
    else if(name === 'rebirthMarkUp') moveSelection(-columnCount());
    else if(name === 'rebirthMarkDown') moveSelection(columnCount());
    else if(name === 'rebirthMarkDroid') retireItem(selectedIndex);
  });

  const gridEl = document.getElementById('grid');

  // Cells in one grid row share an offsetTop, so count the first row's.
  function columnCount(){
    const cells = gridEl.querySelectorAll('.d-cell');
    let cols = 1;
    while(cols < cells.length && cells[cols].offsetTop === cells[0].offsetTop) cols++;
    return cols;
  }

  function applySelection(){
    const cells = gridEl.querySelectorAll('.d-cell');
    cells.forEach(c => c.classList.remove('selected'));
    if(cells[selectedIndex]) cells[selectedIndex].classList.add('selected');
  }

  function moveSelection(delta){
    if(!shownList.length) return;
    selectedIndex = Math.max(0, Math.min(shownList.length - 1, selectedIndex + delta));
    applySelection();
    const cell = gridEl.querySelectorAll('.d-cell')[selectedIndex];
    if(cell) scroller.reveal(cell);
  }

  function retireItem(i){
    const item = shownList[i];
    if(!item) return;
    window.overlayAPI.toggleRetired({ cycle: currentCycle, nk: item.nk, rank: ownedRankLocal[item.nk] });
  }

  // Clicks only reach the cells while the overlay is unlocked (locked = click-through).
  gridEl.addEventListener('click', (e)=>{
    const cell = e.target.closest('.d-cell');
    if(!cell) return;
    selectedIndex = parseInt(cell.dataset.index, 10);
    applySelection();
    retireItem(selectedIndex);
  });

  // Which rarity tiers to show — driven purely by settings (flipped by the
  // tier hotkeys in main.js or the tier buttons in ⚙ Overlay Settings),
  // re-read on every settings:changed. Highest tier first, matching the sort.
  const TIER_SETTING = { Mythic:'declutterShowMythic', Legendary:'declutterShowLegendary', Epic:'declutterShowEpic', Rare:'declutterShowRare', Default:'declutterShowDefault' };
  let tiersOn = { Default:true, Rare:true, Epic:true, Legendary:true, Mythic:true };
  // render() is a no-op until the first fullReload() has built the droid
  // index and loaded progress, so an early settings:changed can't paint a
  // half-loaded list.
  let loaded = false;

  function renderTierPills(){
    const el = document.getElementById('tierPills');
    const anyOff = Object.keys(TIER_SETTING).some(t => !tiersOn[t]);
    el.classList.toggle('visible', anyOff);
    if(!anyOff){ el.innerHTML = ''; return; }
    el.innerHTML = Object.keys(TIER_SETTING).map(t =>
      '<span class="tier-pill' + (tiersOn[t] ? '' : ' off') + '" style="--tc:var(--rarity-' + t.toLowerCase() + ')">' + t + '</span>'
    ).join('');
  }

  function render(){
    if(!loaded) return;
    const countTag = document.getElementById('countTag');
    const all = getDeclutterList(currentCycle, currentLevel, ownedRankLocal);
    const list = all.filter(item => tiersOn[item.rarityClass] !== false);
    // Retired ones sink to the bottom (still in the list's own order), so the
    // next thing to retire moves up under the selection.
    const active = list.filter(item => !itemRetired(item));
    const retired = list.filter(itemRetired);
    shownList = showRetired ? active.concat(retired) : active;
    countTag.textContent = String(active.length);
    const retiredTag = document.getElementById('retiredTag');
    retiredTag.hidden = showRetired || !retired.length;
    retiredTag.textContent = retired.length + ' retired hidden';
    selectedIndex = Math.min(selectedIndex, Math.max(0, shownList.length - 1));
    if(!shownList.length){
      const hiddenByTier = all.length - list.length;
      gridEl.innerHTML = '<div class="empty-msg">' +
        (retired.length ? 'Everything left is retired and hidden — press the Show/Hide Retired hotkey to see them.'
        : hiddenByTier ? (hiddenByTier + ' droid' + (hiddenByTier === 1 ? '' : 's') + ' hidden by the tier filter — turn tiers back on with their hotkeys or in ⚙ Overlay Settings.')
                      : 'Nothing to retire yet — droids show up here once this cycle no longer needs them.') +
        '</div>';
      updateScrollbar();
      return;
    }
    gridEl.innerHTML = shownList.map(cellHtml).join('');
    applySelection();
    updateScrollbar();
  }

  async function fullReload(){
    await loadIndexData();
    await loadProgress();
    loaded = true;
    render();
  }

  window.overlayAPI.onStoreChanged(({ key, value })=>{
    if(key === 'rebirth-ownedRank-v2'){ ownedRankLocal = value || {}; render(); }
    else if(key === 'rebirth-retired'){ retiredLocal = value || {}; render(); }
    else if(key === 'rebirth-activeCycle'){ currentCycle = value || 1; selectedIndex = 0; scroller.toTop(); render(); } // new cycle = new list, start at the top
    else if(key === 'rebirth-currentLevel'){ currentLevel = value || 0; render(); }
    else if(key === 'rebirth-nameMerges' || key === 'rebirth-displayOverrides'){ fullReload(); }
  });

  function applySettings(settings){
    document.body.classList.toggle('unlocked', !settings.declutterLocked);
    // v1.10.0: this overlay's own border skin, picked in ⚙ Overlay Settings →
    // Borders. BORDER_SKINS/borderIconSvg come from requirements.js, loaded above.
    const skin = BORDER_SKINS[settings.declutterBorder] || BORDER_SKINS.grogu;
    document.documentElement.style.setProperty('--accent', skin.hex);
    document.documentElement.style.setProperty('--sw-rgb', skin.rgb);
    const badge = document.getElementById('borderBadge');
    if(badge) badge.innerHTML = borderIconSvg(settings.declutterBorder || 'grogu', 18);
    let changed = false;
    Object.keys(TIER_SETTING).forEach(t=>{
      const v = settings[TIER_SETTING[t]] !== false;
      if(tiersOn[t] !== v){ tiersOn[t] = v; changed = true; }
    });
    const sr = settings.declutterShowRetired !== false;
    if(sr !== showRetired){ showRetired = sr; changed = true; }
    if(changed){ renderTierPills(); render(); }
  }
  window.overlayAPI.onSettingsChanged(applySettings);

  document.getElementById('lockBtn').addEventListener('click', ()=>{
    window.overlayAPI.setDeclutterLocked(true);
  });

  (async function init(){
    const settings = await window.overlayAPI.getSettings();
    applySettings(settings);
    await fullReload();
  })();
})();
</script>
</body>
</html>
