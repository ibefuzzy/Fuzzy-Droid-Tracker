<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Choose a screen to share</title>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:16px 18px; background:#0b0f0d; color:#e7e7e7;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  h1{ font-size:14px; font-weight:600; margin:0 0 12px; color:#f2b95e; }
  .grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr));
    gap:10px; max-height:300px; overflow-y:auto; padding-right:2px;
  }
  .card{
    border:2px solid #2a3330; border-radius:8px; padding:8px; cursor:pointer;
    background:#121715; transition: border-color .12s ease;
  }
  .card:hover{ border-color:#f2b95e; }
  .card img{
    width:100%; height:100px; object-fit:cover; border-radius:4px;
    background:#000; display:block; margin-bottom:6px; pointer-events:none;
  }
  .card .name{
    font-size:12px; color:#cfd6d2; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; pointer-events:none;
  }
  .footer{ margin-top:14px; text-align:right; }
  button{
    background:#1c2320; color:#e7e7e7; border:1px solid #333; border-radius:6px;
    padding:7px 14px; font-size:13px; cursor:pointer;
  }
  button:hover{ border-color:#f2b95e; }
</style>
</head>
<body>
  <h1>Multiple screens detected — choose the one showing the game</h1>
  <div class="grid" id="grid"></div>
  <div class="footer"><button id="cancelBtn">Cancel</button></div>
  <script>
  (function(){
    if(!window.pickerAPI){
      document.body.innerHTML = '<div style="color:#fff;padding:10px;font:12px sans-serif;">Open this file through the Fuzzy\'s Droid Tracker app, not directly in a browser.</div>';
      return;
    }
    const grid = document.getElementById('grid');
    window.pickerAPI.onSources((sources)=>{
      grid.innerHTML = '';
      sources.forEach(s=>{
        // Built with createElement/textContent, not innerHTML string
        // concatenation: unlike every other window in this app (which only
        // ever renders the app's own static, bundled droid data), s.name
        // here is a live OS window/screen title handed back by
        // desktopCapturer — untrusted input this app doesn't control, so it
        // must never be interpolated into markup.
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.id = s.id;
        const img = document.createElement('img');
        img.src = s.thumbnail;
        img.alt = '';
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = s.name;
        card.appendChild(img);
        card.appendChild(name);
        card.addEventListener('click', ()=>{
          window.pickerAPI.choose(card.dataset.id);
        });
        grid.appendChild(card);
      });
    });
    document.getElementById('cancelBtn').addEventListener('click', ()=>{
      window.pickerAPI.cancel();
    });
  })();
  </script>
</body>
</html>
